/* ===== js/state.js ===== */
/* js/state.js */
/* js/state.js — ЯДРО window.CatGame v2 (владелец: otto-логика / god).
   Единственный держатель данных и правил игры (кроме localStorage — тут).
   v2: уровни/xp, стадии роста, здоровье/болезнь, экономика по стадиям,
   оффлайн-прогресс, движок дневных квестов и достижений, save v2 + миграция v1.
   Реализовано по CONTRACT.md (§2, §3, §4, §5, §13). Никакого DOM. */
(function () {
  'use strict';

  var SAVE_KEY = 'catgotchi.save.v2';
  var SAVE_KEY_V1 = 'catgotchi.save.v1';
  var TICK_MS = 1000;
  var SAVE_EVERY = 5;              // тиков (~5с) автосейв
  var HEALTHY_INCOME_EVERY = 10;  // тиков базовый пассивный доход
  var PET_COIN_COOLDOWN_MS = 5000;
  var OFFLINE_CAP_SECS = 8 * 3600; // кап оффлайн-прогресса — 8 часов
  var DAILY_COUNT = 3;            // сколько дневных квестов активно

  // ---------- утилиты ----------
  function clamp(v, lo, hi) {
    if (lo === undefined) lo = 0;
    if (hi === undefined) hi = 100;
    if (typeof v !== 'number' || isNaN(v)) v = lo;
    v = Math.max(lo, Math.min(hi, v));
    return Math.round(v * 100) / 100;
  }
  function numOr(v, f) { return (typeof v === 'number' && !isNaN(v)) ? v : f; }
  function hasStorage() {
    try { return typeof localStorage !== 'undefined' && localStorage !== null; }
    catch (e) { return false; }
  }
  function randId(p) { return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dayDiff(aISO, bISO) {
    // грубая разница в днях между двумя todayISO-строками
    function toN(s) { var p = String(s || '').split('-'); return Date.UTC(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
    if (!aISO || !bISO) return Infinity;
    return Math.round((toN(bISO) - toN(aISO)) / 86400000);
  }

  // ---------- стадии/уровни ----------
  function stageForLevel(lv) {
    if (lv >= 15) return 'adult';
    if (lv >= 5) return 'teen';
    return 'kitten';
  }
  function incomeMult() {
    var s = state.stage;
    return s === 'adult' ? 3 : (s === 'teen' ? 2 : 1);
  }
  function xpForNext(lv) { lv = numOr(lv, state.level); return 40 + lv * 20; }

  // ---------- дефолтное состояние ----------
  function defaultState() {
    return {
      hunger: 80, hygiene: 80, happiness: 80, energy: 80,
      bladder: 0,
      health: 100, sick: false,
      level: 1, xp: 0, stage: 'kitten', ageTicks: 0,
      mircoins: 50,
      poops: [],
      inventory: [],
      equipped: { hat: null, collar: null, outfit: null, bg: null, toy: null, decor: null },
      companions: [],   // id котят-компаньонов (adopted), рендерятся в комнате (jim)
      quests: { daily: [], streak: 0, lastDailyISO: '' },
      achievements: { unlocked: [], progress: {} },
      counters: { pets: 0, feeds: 0, washes: 0, plays: 0, sleeps: 0, poopsCleaned: 0, minigamesPlayed: 0, coinsEarned: 0 },
      name: 'Котёнок',
      settings: { sound: true, theme: 'auto' },
      lastSeen: Date.now(),
      createdAt: Date.now()
    };
  }

  // Единственный объект состояния — ссылка стабильна.
  var state = defaultState();

  // ---------- событийная шина ----------
  var listeners = {};
  function on(evt, cb) { if (typeof cb === 'function') (listeners[evt] = listeners[evt] || []).push(cb); }
  function off(evt, cb) { if (listeners[evt]) listeners[evt] = listeners[evt].filter(function (f) { return f !== cb; }); }
  function emit(evt, data) {
    var subs = listeners[evt];
    if (!subs || !subs.length) return;
    subs.slice().forEach(function (f) { try { f(data); } catch (e) { /* изоляция */ } });
  }

  // ---------- кошелёк ----------
  function balance() { return state.mircoins; }
  function earn(n, reason) {
    n = Math.round(numOr(n, 0));
    if (n <= 0) return;
    state.mircoins += n;
    state.counters.coinsEarned += n;
    bumpQuests('coinsEarned', n);
    checkAchievements();
    emit('wallet:change', { balance: state.mircoins, delta: n, reason: reason || '' });
  }
  function spend(n, reason) {
    n = Math.round(numOr(n, 0));
    if (n < 0) return false;
    if (n === 0) return true;
    if (state.mircoins < n) return false;
    state.mircoins -= n;
    emit('wallet:change', { balance: state.mircoins, delta: -n, reason: reason || '' });
    return true;
  }

  // ---------- xp / уровни / стадии ----------
  function addXp(n, reason) {
    n = Math.round(numOr(n, 0));
    if (n <= 0) return;
    state.xp += n;
    var leveled = false;
    while (state.xp >= xpForNext(state.level) && state.level < 50) {
      state.xp -= xpForNext(state.level);
      state.level++;
      leveled = true;
      earn(state.level * 5, 'награда за уровень');
      emit('level:up', { level: state.level });
    }
    emit('xp:change', { xp: state.xp, level: state.level, reason: reason || '' });
    if (leveled) {
      var ns = stageForLevel(state.level);
      if (ns !== state.stage) { state.stage = ns; emit('stage:change', { stage: ns }); }
      checkAchievements();
    }
  }

  // ---------- какашки ----------
  function spawnPoop() {
    var poop = { id: randId('poop'), x: Math.round((Math.random() * 0.8 + 0.1) * 1000) / 1000, y: Math.round((Math.random() * 0.8 + 0.1) * 1000) / 1000 };
    state.poops.push(poop);
    emit('poop:spawn', poop);
    return poop;
  }

  // ---------- здоровье ----------
  function updateHealth(dt) {
    var low = 0;
    if (state.hunger < 20) low++;
    if (state.hygiene < 20) low++;
    if (state.happiness < 20) low++;
    if (state.energy < 20) low++;
    var prevSick = state.sick;
    var prevHealth = state.health;
    if (low >= 2) state.health = clamp(state.health - 0.5 * dt);
    else if (low === 0) state.health = clamp(state.health + 0.15 * dt);
    if (state.health < 25) state.sick = true;
    if (state.sick && state.health >= 60) state.sick = false;
    if (state.sick !== prevSick || Math.abs(state.health - prevHealth) >= 0.01) {
      emit('health:change', { health: state.health, sick: state.sick });
    }
  }

  // ---------- действия игрока ----------
  var lastPetCoinAt = 0;
  function actPet() {
    state.happiness = clamp(state.happiness + 8);
    state.counters.pets++;
    bumpQuests('pets', 1);
    var now = Date.now();
    if (now - lastPetCoinAt >= PET_COIN_COOLDOWN_MS) { lastPetCoinAt = now; earn(1, 'погладили котёнка'); }
    checkAchievements();
    emit('action:pet', { state: state });
    emit('stats:change', { state: state });
    return true;
  }
  function actFeed() {
    state.hunger = clamp(state.hunger + 25);
    state.hygiene = clamp(state.hygiene - 3);
    state.counters.feeds++;
    bumpQuests('feeds', 1);
    addXp(4, 'покормили');
    checkAchievements();
    emit('action:feed', { state: state });
    emit('stats:change', { state: state });
    return true;
  }
  function actWash() {
    state.hygiene = clamp(state.hygiene + 30);
    state.counters.washes++;
    bumpQuests('washes', 1);
    addXp(4, 'помыли');
    checkAchievements();
    emit('action:wash', { state: state });
    emit('stats:change', { state: state });
    return true;
  }
  function actPlay() {
    if (state.energy <= 10) return false;
    state.happiness = clamp(state.happiness + 12);
    state.energy = clamp(state.energy - 15);
    state.counters.plays++;
    bumpQuests('plays', 1);
    addXp(6, 'поиграли');
    checkAchievements();
    emit('action:play', { state: state });
    emit('stats:change', { state: state });
    return true;
  }
  function actSleep() {
    state.energy = clamp(state.energy + 40);
    state.counters.sleeps++;
    bumpQuests('sleeps', 1);
    checkAchievements();
    emit('action:sleep', { state: state });
    emit('stats:change', { state: state });
    return true;
  }
  function actCleanPoop(id) {
    var idx = -1;
    for (var i = 0; i < state.poops.length; i++) { if (state.poops[i].id === id) { idx = i; break; } }
    if (idx === -1) return false;
    state.poops.splice(idx, 1);
    state.hygiene = clamp(state.hygiene + 10);
    state.counters.poopsCleaned++;
    bumpQuests('poopsCleaned', 1);
    earn(2, 'убрали какашку');
    addXp(3, 'чистота');
    checkAchievements();
    emit('poop:clean', { id: id });
    emit('stats:change', { state: state });
    return true;
  }
  function actHeal() {
    if (!state.sick) return false;
    var cost = 20 + state.level * 2;
    if (!spend(cost, 'ветеринар')) return false;
    state.sick = false;
    state.health = 70;
    emit('action:heal', { state: state });
    emit('health:change', { health: state.health, sick: state.sick });
    emit('stats:change', { state: state });
    return true;
  }

  // ---------- мини-игры (мост) ----------
  function minigameReward(gameId, score) {
    score = Math.max(0, Math.round(numOr(score, 0)));
    var coins = Math.round(score * 1.5) + 3;
    var happy = Math.min(20, 5 + Math.round(score / 2));
    var xp = 5 + Math.round(score / 2);
    state.happiness = clamp(state.happiness + happy);
    state.energy = clamp(state.energy - 8);
    state.counters.minigamesPlayed++;
    bumpQuests('minigamesPlayed', 1);
    earn(coins, 'мини-игра: ' + gameId);
    addXp(xp, 'мини-игра');
    checkAchievements();
    var reward = { coins: coins, happy: happy, xp: xp };
    emit('minigame:done', { gameId: gameId, score: score, reward: reward });
    emit('stats:change', { state: state });
    return reward;
  }

  // ---------- дневные квесты ----------
  function pool() { return (window.CatMeta && Array.isArray(window.CatMeta.dailyPool)) ? window.CatMeta.dailyPool : []; }
  function achDefs() { return (window.CatMeta && Array.isArray(window.CatMeta.achievements)) ? window.CatMeta.achievements : []; }

  function rollDailies() {
    var p = pool().slice();
    var picked = [];
    for (var i = 0; i < DAILY_COUNT && p.length; i++) {
      var idx = Math.floor(Math.random() * p.length);
      var tpl = p.splice(idx, 1)[0];
      picked.push({ id: tpl.id, metric: tpl.metric, target: tpl.target, reward: tpl.reward, progress: 0, done: false, claimed: false });
    }
    return picked;
  }
  function refreshDailies() {
    var today = todayISO();
    var last = state.quests.lastDailyISO;
    if (last === today) return; // уже свежие
    // стрик: если играли вчера — +1, иначе сброс к 1
    var d = dayDiff(last, today);
    if (last && d === 1) state.quests.streak = (state.quests.streak || 0) + 1;
    else state.quests.streak = 1;
    state.quests.daily = rollDailies();
    state.quests.lastDailyISO = today;
  }
  function bumpQuests(metric, amount) {
    var list = state.quests.daily || [];
    var changed = false;
    for (var i = 0; i < list.length; i++) {
      var q = list[i];
      if (q.metric !== metric || q.done) continue;
      q.progress = Math.min(q.target, q.progress + amount);
      changed = true;
      emit('quest:progress', { id: q.id });
      if (q.progress >= q.target) { q.done = true; emit('quest:done', { id: q.id }); }
    }
    return changed;
  }
  function dailyQuests() { return state.quests.daily || []; }
  function claimQuest(id) {
    var list = state.quests.daily || [];
    for (var i = 0; i < list.length; i++) {
      var q = list[i];
      if (q.id === id && q.done && !q.claimed) {
        q.claimed = true;
        earn(q.reward || 0, 'квест: ' + id);
        emit('quest:claim', { id: id, reward: q.reward || 0 });
        save();
        return true;
      }
    }
    return false;
  }
  function streak() { return state.quests.streak || 0; }

  // ---------- достижения ----------
  function metricValue(metric) {
    if (metric === 'level') return state.level;
    if (metric === 'companions') return state.companions.length;
    return numOr(state.counters[metric], 0);
  }
  function checkAchievements() {
    var defs = achDefs();
    for (var i = 0; i < defs.length; i++) {
      var a = defs[i];
      var v = metricValue(a.metric);
      state.achievements.progress[a.id] = v;
      if (v >= a.target && state.achievements.unlocked.indexOf(a.id) === -1) {
        state.achievements.unlocked.push(a.id);
        earn(15, 'достижение: ' + a.id);
        emit('achievement:unlock', { id: a.id });
      }
    }
  }
  function achievements() {
    return achDefs().map(function (a) {
      return {
        id: a.id, def: a,
        unlocked: state.achievements.unlocked.indexOf(a.id) !== -1,
        progress: numOr(state.achievements.progress[a.id], metricValue(a.metric))
      };
    });
  }

  // ---------- день/ночь ----------
  var lastNight = null;
  function isNight() {
    if (state.settings.theme === 'day') return false;
    if (state.settings.theme === 'night') return true;
    var h = new Date().getHours();
    return (h < 7 || h >= 20);
  }
  function checkDayNight() {
    var n = isNight();
    if (n !== lastNight) { lastNight = n; emit('daynight:change', { night: n }); }
  }

  // ---------- тик-луп ----------
  var tickTimer = null, tickCount = 0;
  function isHealthy() {
    return state.hunger > 60 && state.hygiene > 60 && state.happiness > 60 && state.energy > 60 && state.poops.length === 0;
  }
  function applyDecay(dt) {
    var poopPenalty = state.poops.length * 0.15;
    state.hunger = clamp(state.hunger - 0.4 * dt);
    state.hygiene = clamp(state.hygiene - (0.2 + poopPenalty) * dt);
    state.happiness = clamp(state.happiness - 0.15 * dt);
    state.energy = clamp(state.energy - 0.1 * dt);
    state.bladder = clamp(state.bladder + 1.2 * dt);
    state.ageTicks += dt;
  }
  function tick() {
    tickCount++;
    applyDecay(1);
    if (state.bladder >= 100) { spawnPoop(); state.bladder = 0; }
    updateHealth(1);
    if (isHealthy() && (tickCount % HEALTHY_INCOME_EVERY === 0)) earn(1 * incomeMult(), 'пассивный доход');
    checkDayNight();
    state.lastSeen = Date.now();
    emit('tick', { state: state });
    emit('stats:change', { state: state });
    if (tickCount % SAVE_EVERY === 0) save();
  }
  function startTickLoop() { if (!tickTimer) tickTimer = setInterval(tick, TICK_MS); }

  // ---------- оффлайн-прогресс ----------
  function applyOffline() {
    var now = Date.now();
    var secs = Math.floor((now - numOr(state.lastSeen, now)) / 1000);
    if (secs < 60) return; // меньше минуты — не считаем
    secs = Math.min(secs, OFFLINE_CAP_SECS);
    var ticks = secs; // 1 тик = 1с
    // деградация статов (без спавна какашек по одной — начислим оптом)
    var poopPenalty = 0.15;
    state.hunger = clamp(state.hunger - 0.4 * ticks);
    state.hygiene = clamp(state.hygiene - (0.2 + poopPenalty) * ticks);
    state.happiness = clamp(state.happiness - 0.15 * ticks);
    state.energy = clamp(state.energy - 0.1 * ticks);
    updateHealth(Math.min(ticks, 120));
    // пассивный доход (только если было здорово на момент ухода — упростим: половина ставки)
    var coins = Math.floor(ticks / HEALTHY_INCOME_EVERY) * incomeMult();
    coins = Math.min(coins, 500); // разумный кап
    if (coins > 0) { state.mircoins += coins; state.counters.coinsEarned += coins; }
    state.lastSeen = now;
    emit('offline:report', { secs: secs, coins: coins });
  }

  // ---------- сейв/загрузка ----------
  function applyState(src) {
    var def = defaultState();
    src = src || {};
    state.hunger = clamp(numOr(src.hunger, def.hunger));
    state.hygiene = clamp(numOr(src.hygiene, def.hygiene));
    state.happiness = clamp(numOr(src.happiness, def.happiness));
    state.energy = clamp(numOr(src.energy, def.energy));
    state.bladder = clamp(numOr(src.bladder, def.bladder));
    state.health = clamp(numOr(src.health, def.health));
    state.sick = !!src.sick;
    state.level = Math.max(1, Math.min(50, Math.round(numOr(src.level, def.level))));
    state.xp = Math.max(0, Math.round(numOr(src.xp, def.xp)));
    state.stage = stageForLevel(state.level);
    state.ageTicks = Math.max(0, Math.round(numOr(src.ageTicks, def.ageTicks)));
    state.mircoins = Math.max(0, Math.round(numOr(src.mircoins, def.mircoins)));
    state.poops = Array.isArray(src.poops) ? src.poops.filter(function (p) { return p && typeof p.id === 'string'; }) : [];
    state.inventory = Array.isArray(src.inventory) ? src.inventory.slice() : [];
    var eq = (src.equipped && typeof src.equipped === 'object') ? src.equipped : {};
    state.equipped = { hat: eq.hat || null, collar: eq.collar || null, outfit: eq.outfit || null, bg: eq.bg || null, toy: eq.toy || null, decor: eq.decor || null };
    state.companions = Array.isArray(src.companions) ? src.companions.filter(function (c) { return typeof c === 'string'; }) : [];
    var q = (src.quests && typeof src.quests === 'object') ? src.quests : {};
    state.quests = { daily: Array.isArray(q.daily) ? q.daily : [], streak: Math.max(0, Math.round(numOr(q.streak, 0))), lastDailyISO: q.lastDailyISO || '' };
    var ac = (src.achievements && typeof src.achievements === 'object') ? src.achievements : {};
    state.achievements = { unlocked: Array.isArray(ac.unlocked) ? ac.unlocked.slice() : [], progress: (ac.progress && typeof ac.progress === 'object') ? ac.progress : {} };
    var c = (src.counters && typeof src.counters === 'object') ? src.counters : {};
    state.counters = {
      pets: numOr(c.pets, 0), feeds: numOr(c.feeds, 0), washes: numOr(c.washes, 0),
      plays: numOr(c.plays, 0), sleeps: numOr(c.sleeps, 0), poopsCleaned: numOr(c.poopsCleaned, 0),
      minigamesPlayed: numOr(c.minigamesPlayed, 0), coinsEarned: numOr(c.coinsEarned, 0)
    };
    state.name = (typeof src.name === 'string' && src.name) ? src.name : def.name;
    var s = (src.settings && typeof src.settings === 'object') ? src.settings : {};
    state.settings = { sound: s.sound !== false, theme: (s.theme === 'day' || s.theme === 'night') ? s.theme : 'auto' };
    state.lastSeen = numOr(src.lastSeen, Date.now());
    state.createdAt = numOr(src.createdAt, def.createdAt);
  }

  function save() {
    if (!hasStorage()) return;
    try {
      var payload = { v: 2, savedAt: Date.now(), state: state };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    } catch (e) { /* приватный режим/квота */ }
  }

  function migrateV1(v1) {
    // v1: {v:1, savedAt, state:{hunger,hygiene,happiness,energy,bladder,mircoins,poops,inventory,equipped}}
    var s = (v1 && v1.state) ? v1.state : v1;
    var mapped = defaultState();
    if (s) {
      mapped.hunger = numOr(s.hunger, mapped.hunger);
      mapped.hygiene = numOr(s.hygiene, mapped.hygiene);
      mapped.happiness = numOr(s.happiness, mapped.happiness);
      mapped.energy = numOr(s.energy, mapped.energy);
      mapped.bladder = numOr(s.bladder, mapped.bladder);
      mapped.mircoins = numOr(s.mircoins, mapped.mircoins);
      mapped.poops = Array.isArray(s.poops) ? s.poops : [];
      mapped.inventory = Array.isArray(s.inventory) ? s.inventory : [];
      if (s.equipped && typeof s.equipped === 'object') {
        mapped.equipped.hat = s.equipped.hat || null;
        mapped.equipped.collar = s.equipped.collar || null;
        mapped.equipped.outfit = s.equipped.outfit || null;
        mapped.equipped.bg = s.equipped.bg || null;
        mapped.equipped.toy = s.equipped.toy || null;
      }
    }
    return mapped;
  }

  function load() {
    if (!hasStorage()) { applyState(defaultState()); return; }
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) { var parsed = JSON.parse(raw); applyState(parsed && parsed.state ? parsed.state : parsed); return; }
      var rawV1 = localStorage.getItem(SAVE_KEY_V1);
      if (rawV1) { applyState(migrateV1(JSON.parse(rawV1))); save(); return; }
      applyState(defaultState());
    } catch (e) { applyState(defaultState()); }
  }

  function reset() {
    applyState(defaultState());
    if (hasStorage()) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
    refreshDailies();
    save();
    emit('stats:change', { state: state });
    emit('wallet:change', { balance: state.mircoins, delta: 0, reason: 'reset' });
    emit('health:change', { health: state.health, sick: state.sick });
    emit('xp:change', { xp: state.xp, level: state.level });
  }

  // ---------- гардероб ----------
  function findItem(itemId) {
    var list = window.CatItems || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === itemId) return list[i];
    return null;
  }
  function wOwn(itemId) { return state.inventory.indexOf(itemId) !== -1; }
  function wBuy(itemId) {
    if (!itemId || wOwn(itemId)) return false;
    var item = findItem(itemId);
    if (!item) return false;
    if (!spend(item.price, 'покупка: ' + (item.name || itemId))) return false;
    state.inventory.push(itemId);
    emit('item:buy', { itemId: itemId, item: item });
    save();
    return true;
  }
  function wEquip(slot, itemId) {
    if (!slot || !(slot in state.equipped)) return;
    if (itemId) {
      if (!wOwn(itemId)) return;
      var item = findItem(itemId);
      if (item && item.slot && item.slot !== slot) return;
    } else { itemId = null; }
    state.equipped[slot] = itemId;
    emit('item:equip', { slot: slot, itemId: itemId });
    save();
  }
  function wUnequip(slot) {
    if (!slot || !(slot in state.equipped)) return;
    state.equipped[slot] = null;
    emit('item:equip', { slot: slot, itemId: null });
    save();
  }
  function wEquippedItem(slot) { return (state.equipped && state.equipped[slot]) || null; }

  // ---------- компаньоны (котята) ----------
  var COMPANION_CAP = 6; // максимум adopted-компаньонов
  function compCatalog() { return (window.CatCompanions && Array.isArray(window.CatCompanions)) ? window.CatCompanions : []; }
  function compFind(id) { var l = compCatalog(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
  function compList() { return state.companions.slice(); }
  function compOwn(id) { return state.companions.indexOf(id) !== -1; }
  function compAdopt(id) {
    if (!id || compOwn(id)) return false;
    if (state.companions.length >= COMPANION_CAP) return false;
    var c = compFind(id);
    if (!c) return false;
    if (!spend(c.price || 0, 'котёнок-компаньон: ' + (c.name || id))) return false;
    state.companions.push(id);
    checkAchievements();
    emit('companion:adopt', { id: id, companion: c });
    emit('stats:change', { state: state });
    save();
    return true;
  }

  // ---------- настройки ----------
  function setSound(on2) {
    state.settings.sound = !!on2;
    if (window.CatAudio && window.CatAudio.setEnabled) window.CatAudio.setEnabled(state.settings.sound);
    emit('settings:change', { settings: state.settings });
    save();
  }
  function setTheme(t) {
    state.settings.theme = (t === 'day' || t === 'night') ? t : 'auto';
    lastNight = null; checkDayNight();
    emit('settings:change', { settings: state.settings });
    save();
  }
  function setName(str) {
    str = String(str || '').trim().slice(0, 20);
    if (!str) return;
    state.name = str;
    emit('name:change', { name: str });
    save();
  }

  // ---------- init ----------
  var initStarted = false, readyResolve;
  var readyPromise = new Promise(function (res) { readyResolve = res; });
  function init() {
    if (initStarted) return readyPromise;
    initStarted = true;
    load();
    applyOffline();
    refreshDailies();
    checkAchievements();
    if (window.CatAudio && window.CatAudio.setEnabled) window.CatAudio.setEnabled(state.settings.sound);
    lastNight = null; checkDayNight();
    startTickLoop();
    save();
    emit('ready', { state: state });
    readyResolve();
    return readyPromise;
  }

  // ---------- публичный объект ----------
  window.CatGame = {
    state: state,
    ready: readyPromise,
    init: init, save: save, load: load, reset: reset,
    on: on, off: off, emit: emit,
    wallet: { balance: balance, earn: earn, spend: spend },
    actions: { pet: actPet, feed: actFeed, wash: actWash, play: actPlay, sleep: actSleep, cleanPoop: actCleanPoop, heal: actHeal },
    wardrobe: { buy: wBuy, own: wOwn, equip: wEquip, unequip: wUnequip, equippedItem: wEquippedItem },
    companions: { list: compList, own: compOwn, adopt: compAdopt, all: compCatalog, find: compFind, cap: function () { return COMPANION_CAP; } },
    progress: { level: function () { return state.level; }, xp: function () { return state.xp; }, xpForNext: function () { return xpForNext(state.level); }, stage: function () { return state.stage; }, addXp: addXp },
    minigame: { reward: minigameReward },
    meta: { dailyQuests: dailyQuests, claimQuest: claimQuest, achievements: achievements, streak: streak },
    setSound: setSound, setTheme: setTheme, setName: setName, isNight: isNight
  };
})();

</script>

<script>
/* ===== js/minigames.js ===== */
/* js/minigames.js — модуль мини-игр «Мяугочи ×10» (владелец: kevin).
   Глобал: window.MiniGames. CSS-namespace: .mg-. Весь DOM/логика — внутри
   переданного hostEl. Читает CatGame только через API §3, звук — через CatAudio (§7).

   Публичный API (§8):
     MiniGames.list()                       -> [{id,name,emoji,desc}] (3 игры)
     MiniGames.mount(containerEl)           -> рисует меню выбора игр
     MiniGames.start(gameId, hostEl, onDone) -> запускает игру; по завершении
                                               зовёт CatGame.minigame.reward(id,score),
                                               затем onDone(score)
     MiniGames.stop()                       -> остановить/очистить текущую (без утечек)
*/
(function () {
  'use strict';

  /* ======================= каталог игр ======================= */
  var GAMES = [
    { id: 'mouse', name: 'Поймай мышку', emoji: '🐭',
      desc: 'Лови мышек, пока они не убежали. 30 секунд!' },
    { id: 'fish',  name: 'Рыбалка',      emoji: '🎣',
      desc: 'Подсеки в зелёной зоне. Зона сужается!' },
    { id: 'yarn',  name: 'Клубок',       emoji: '🧶',
      desc: 'Запомни и повтори последовательность клубков.' }
  ];

  var FISH_ROUNDS = 5;   // раундов в рыбалке
  var YARN_MAX = 20;     // потолок уровней «Клубка» (гарантирует завершение)

  /* ======================= состояние модуля ======================= */
  var _session = null;   // активная «сессия» (таймеры/слушатели текущего экрана)
  var _host = null;      // текущий контейнер, куда рисуем
  var _mode = null;      // 'menu' | 'intro' | 'game' | 'result' | 'tired'

  /* ======================= утилиты ======================= */
  function el(tag, cls) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    return e;
  }

  function clearHost(host) {
    if (!host) return;
    while (host.firstChild) host.removeChild(host.firstChild);
  }

  function now() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  function reducedMotion() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { return false; }
  }

  // Короткий синтез-звук через CatAudio (защищаемся от отсутствия).
  function playSound(name) {
    try {
      if (window.CatAudio && typeof window.CatAudio.play === 'function') {
        window.CatAudio.play(name);
      }
    } catch (e) { /* тишина при ошибке звука не должна ломать игру */ }
  }

  // Всплеск-анимация числа (перезапуск через reflow).
  function bump(node) {
    node.classList.remove('is-bump');
    void node.offsetWidth; // форсируем reflow, чтобы анимация проиграла заново
    node.classList.add('is-bump');
  }

  // Текущая энергия котёнка (только через CatGame.state, §3). Если состояние
  // недоступно (модуль запущен изолированно) — не блокируем игру.
  function getEnergy() {
    try {
      var st = window.CatGame && window.CatGame.state;
      if (st && typeof st.energy === 'number') return st.energy;
    } catch (e) {}
    return 100;
  }

  function gameById(id) {
    for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i];
    return null;
  }

  // Подпись результата под конкретную механику.
  function scoreLine(gameId, score) {
    if (gameId === 'mouse') return 'Поймано мышек: ' + score;
    if (gameId === 'fish')  return 'Удачных подсечек: ' + score + ' из ' + FISH_ROUNDS;
    if (gameId === 'yarn')  return 'Достигнут уровень: ' + score;
    return 'Счёт: ' + score;
  }

  /* ======================= сессия: учёт таймеров/слушателей ======================= */
  // Все таймеры/интервалы/RAF/слушатели проходят через сессию, чтобы cleanup()
  // гарантированно всё снял (без утечек при stop() и повторном старте).
  function makeSession(host) {
    var timers = new Set();
    var intervals = new Set();
    var rafs = new Set();
    var listeners = [];
    var alive = true;

    return {
      host: host,
      alive: function () { return alive; },
      timeout: function (fn, ms) {
        var id = setTimeout(function () { timers.delete(id); if (alive) fn(); }, ms);
        timers.add(id);
        return id;
      },
      interval: function (fn, ms) {
        var id = setInterval(function () { if (alive) fn(); }, ms);
        intervals.add(id);
        return id;
      },
      raf: function (fn) {
        var id = requestAnimationFrame(function (t) { rafs.delete(id); if (alive) fn(t); });
        rafs.add(id);
        return id;
      },
      clear: function (id) { clearTimeout(id); timers.delete(id); },
      on: function (node, evt, fn, opts) {
        node.addEventListener(evt, fn, opts);
        listeners.push([node, evt, fn, opts]);
      },
      cleanup: function () {
        alive = false;
        timers.forEach(clearTimeout);
        intervals.forEach(clearInterval);
        rafs.forEach(cancelAnimationFrame);
        listeners.forEach(function (l) {
          try { l[0].removeEventListener(l[1], l[2], l[3]); } catch (e) {}
        });
        timers.clear(); intervals.clear(); rafs.clear();
        listeners.length = 0;
      }
    };
  }

  // Снять предыдущую сессию (перед сменой экрана/игры).
  function teardown() {
    if (_session) { _session.cleanup(); _session = null; }
  }

  /* ======================= награда ======================= */
  // Начисляем награду строго через CatGame.minigame.reward (§3) и определяем,
  // сколько монет реально начислено, чтобы показать это на экране результата.
  // Источники (в порядке приоритета): значение из события 'minigame:done',
  // возврат функции reward, дельта кошелька.
  function grantReward(gameId, score) {
    var out = { coins: 0, xp: 0, happiness: 0 };
    var cg = window.CatGame;

    function absorb(r) {
      if (r == null) return;
      if (typeof r === 'number') { out.coins = r; return; }
      if (typeof r === 'object') {
        if (typeof r.coins === 'number') out.coins = r.coins;
        else if (typeof r.mircoins === 'number') out.coins = r.mircoins;
        else if (typeof r.coin === 'number') out.coins = r.coin;
        if (typeof r.xp === 'number') out.xp = r.xp;
        if (typeof r.happiness === 'number') out.happiness = r.happiness;
      }
    }

    var balBefore = 0;
    try { if (cg && cg.wallet && cg.wallet.balance) balBefore = cg.wallet.balance() | 0; } catch (e) {}

    // Ловим полезную нагрузку события 'minigame:done {gameId,score,reward}'.
    var captured = null;
    function onDoneEvt(d) { captured = d; }
    try { if (cg && cg.on) cg.on('minigame:done', onDoneEvt); } catch (e) {}

    try {
      if (cg && cg.minigame && typeof cg.minigame.reward === 'function') {
        absorb(cg.minigame.reward(gameId, score));
      }
    } catch (e) { /* защищаемся от отсутствия/ошибки CatGame.minigame */ }

    try { if (cg && cg.off) cg.off('minigame:done', onDoneEvt); } catch (e) {}

    if (captured && captured.reward != null) absorb(captured.reward);

    // Фолбэк: если монеты так и не определились — берём дельту кошелька.
    if (!out.coins) {
      try {
        var balAfter = (cg && cg.wallet && cg.wallet.balance) ? (cg.wallet.balance() | 0) : balBefore;
        if (balAfter > balBefore) out.coins = balAfter - balBefore;
      } catch (e) {}
    }
    return out;
  }

  /* ======================= экраны: меню ======================= */
  function renderMenu(container) {
    teardown();
    _host = container;
    _mode = 'menu';
    _session = makeSession(container);
    clearHost(container);

    var menu = el('div', 'mg-menu');

    var title = el('div', 'mg-menu-title');
    title.textContent = 'Мини-игры';
    var sub = el('div', 'mg-menu-sub');
    sub.textContent = 'Играй и зарабатывай микоины 🪙';
    menu.appendChild(title);
    menu.appendChild(sub);

    var grid = el('div', 'mg-grid');
    GAMES.forEach(function (g) {
      var card = el('button', 'mg-card');
      card.type = 'button';

      var em = el('div', 'mg-card-emoji');
      em.textContent = g.emoji;
      var nm = el('div', 'mg-card-name');
      nm.textContent = g.name;
      var ds = el('div', 'mg-card-desc');
      ds.textContent = g.desc;

      card.appendChild(em);
      card.appendChild(nm);
      card.appendChild(ds);

      _session.on(card, 'click', function () {
        playSound('click');
        launch(g.id, container, undefined, false);
      });
      grid.appendChild(card);
    });
    menu.appendChild(grid);
    container.appendChild(menu);
  }

  /* ======================= экран: «котёнок устал» ======================= */
  function renderTired(host, gameId, onDone) {
    teardown();
    _host = host;
    _mode = 'tired';
    _session = makeSession(host);
    clearHost(host);
    playSound('error');

    var box = el('div', 'mg-tired');
    var em = el('div', 'mg-big-emoji');
    em.textContent = '😴';
    var t = el('div', 'mg-panel-title');
    t.textContent = 'Котёнок устал';
    var d = el('div', 'mg-panel-desc');
    d.textContent = 'Слишком мало энергии для игры. Дай питомцу поспать или отдохнуть и возвращайся!';
    var back = el('button', 'mg-btn mg-btn-ghost');
    back.type = 'button';
    back.textContent = 'К играм';
    _session.on(back, 'click', function () { playSound('click'); renderMenu(host); });

    box.appendChild(em);
    box.appendChild(t);
    box.appendChild(d);
    box.appendChild(back);
    host.appendChild(box);
  }

  /* ======================= экран: подсказка старта ======================= */
  function renderIntro(host, def, onDone) {
    teardown();
    _host = host;
    _mode = 'intro';
    _session = makeSession(host);
    clearHost(host);

    var how = {
      mouse: 'Мышки 🐭 выскакивают в случайных местах на пару мгновений. Успей тапнуть по каждой! Игра длится 30 секунд.',
      fish:  'По шкале бегает поплавок. Тапни «Подсечь», когда он в зелёной зоне. Раунд за раундом зона сужается.',
      yarn:  'Клубки 🧶 загораются по очереди. Запомни порядок и повтори его тапами. Каждый раунд — на один длиннее.'
    };

    var box = el('div', 'mg-intro');
    var em = el('div', 'mg-big-emoji');
    em.textContent = def.emoji;
    var t = el('div', 'mg-panel-title');
    t.textContent = def.name;
    var d = el('div', 'mg-panel-desc');
    d.textContent = how[def.id] || def.desc;

    var row = el('div', 'mg-btn-row');
    var go = el('button', 'mg-btn mg-btn-primary');
    go.type = 'button';
    go.textContent = 'Начать';
    var back = el('button', 'mg-btn mg-btn-ghost');
    back.type = 'button';
    back.textContent = 'Назад';
    _session.on(go, 'click', function () { playSound('click'); runGame(def, host, onDone); });
    _session.on(back, 'click', function () { playSound('click'); renderMenu(host); });
    row.appendChild(go);
    row.appendChild(back);

    box.appendChild(em);
    box.appendChild(t);
    box.appendChild(d);
    box.appendChild(row);
    host.appendChild(box);
  }

  /* ======================= экран: результат ======================= */
  function renderResult(host, def, score, onDone) {
    // Останавливаем игровой цикл, начисляем награду, показываем итог.
    teardown();
    _host = host;
    _mode = 'result';
    _session = makeSession(host);

    var reward = grantReward(def.id, score); // §3: reward(...) вызывается здесь
    clearHost(host);
    playSound('win');

    var box = el('div', 'mg-result');
    var em = el('div', 'mg-big-emoji');
    em.textContent = '🎉';
    var t = el('div', 'mg-panel-title');
    t.textContent = 'Игра окончена!';

    var sc = el('div', 'mg-result-score');
    sc.textContent = scoreLine(def.id, score);

    var rew = el('div', 'mg-reward');
    var coinPart = el('span', 'mg-reward-coins');
    coinPart.textContent = '+' + (reward.coins || 0) + ' 🪙';
    rew.appendChild(coinPart);
    if (reward.xp) {
      var xpPart = el('span', 'mg-reward-xp');
      xpPart.textContent = '+' + reward.xp + ' XP';
      rew.appendChild(xpPart);
    }
    if (reward.happiness) {
      var hp = el('span', 'mg-reward-happy');
      hp.textContent = '+' + reward.happiness + ' 😻';
      rew.appendChild(hp);
    }

    var row = el('div', 'mg-btn-row');
    var again = el('button', 'mg-btn mg-btn-primary');
    again.type = 'button';
    again.textContent = 'Ещё раз';
    var exit = el('button', 'mg-btn mg-btn-ghost');
    exit.type = 'button';
    exit.textContent = 'Выход';
    _session.on(again, 'click', function () {
      playSound('click');
      launch(def.id, host, onDone, true); // повтор без вступления (с проверкой энергии)
    });
    _session.on(exit, 'click', function () { playSound('click'); renderMenu(host); });
    row.appendChild(again);
    row.appendChild(exit);

    box.appendChild(em);
    box.appendChild(t);
    box.appendChild(sc);
    box.appendChild(rew);
    box.appendChild(row);
    host.appendChild(box);

    // §8: сначала reward (уже начислена), затем onDone(score).
    if (typeof onDone === 'function') {
      try { onDone(score); } catch (e) {}
    }
  }

  // Завершение любой игры -> экран результата.
  function finishGame(host, def, score, onDone) {
    renderResult(host, def, score, onDone);
  }

  /* ======================= запуск игры ======================= */
  // Единая точка входа: проверка энергии -> вступление/игра.
  function launch(gameId, host, onDone, skipIntro) {
    teardown();
    _host = host;
    clearHost(host);

    var def = gameById(gameId);
    if (!def) { renderMenu(host); return; }

    // §8: требуется CatGame.state.energy > 10, иначе подсказка «котёнок устал».
    if (!(getEnergy() > 10)) { renderTired(host, gameId, onDone); return; }

    if (skipIntro) runGame(def, host, onDone);
    else renderIntro(host, def, onDone);
  }

  function runGame(def, host, onDone) {
    if (def.id === 'mouse') return runMouse(def, host, onDone);
    if (def.id === 'fish')  return runFish(def, host, onDone);
    if (def.id === 'yarn')  return runYarn(def, host, onDone);
    renderMenu(host);
  }

  /* ======================= игра 1: «Поймай мышку» ======================= */
  function runMouse(def, host, onDone) {
    teardown();
    _host = host;
    _mode = 'game';
    var s = makeSession(host);
    _session = s;
    clearHost(host);

    var reduced = reducedMotion();
    var DUR = 30000;      // 30 секунд
    var MAX_ON = 4;       // не больше 4 мышек одновременно
    var score = 0;
    var active = 0;
    var ended = false;
    var startT = now();

    var root = el('div', 'mg-root mg-mouse');

    var head = el('div', 'mg-head');
    var scoreEl = el('div', 'mg-score');
    scoreEl.textContent = '🐭 0';
    var timer = el('div', 'mg-timer');
    var timerBar = el('i');
    timer.appendChild(timerBar);
    head.appendChild(scoreEl);
    head.appendChild(timer);

    var field = el('div', 'mg-field');
    root.appendChild(head);
    root.appendChild(field);
    host.appendChild(root);

    // Таймер обратного отсчёта.
    s.interval(function () {
      var t = now() - startT;
      var frac = Math.max(0, 1 - t / DUR);
      timerBar.style.width = (frac * 100).toFixed(1) + '%';
      if (t >= DUR) end();
    }, 100);

    function end() {
      if (ended) return;
      ended = true;
      finishGame(host, def, score, onDone);
    }

    function spawn() {
      if (!s.alive() || ended) return;
      var elapsed = now() - startT;
      if (elapsed >= DUR) return;

      if (active < MAX_ON) {
        var rect = field.getBoundingClientRect();
        var fw = rect.width || field.clientWidth || 300;
        var fh = rect.height || field.clientHeight || 300;
        var size = 56;

        var m = el('button', 'mg-mouse-btn');
        m.type = 'button';
        m.textContent = '🐭';
        m.style.left = (Math.random() * Math.max(1, fw - size)) + 'px';
        m.style.top = (Math.random() * Math.max(1, fh - size)) + 'px';
        field.appendChild(m);
        active++;

        // Со временем мышки живут меньше — сложнее.
        var life = reduced ? 1300 : (1150 - Math.min(520, (elapsed / DUR) * 620));
        var caught = false;

        function removeM() {
          if (m.parentNode) m.parentNode.removeChild(m);
          active = Math.max(0, active - 1);
        }
        var lifeTimer = s.timeout(removeM, life);

        s.on(m, 'pointerdown', function (ev) {
          ev.preventDefault();
          if (caught || ended) return;
          caught = true;
          s.clear(lifeTimer);
          score++;
          scoreEl.textContent = '🐭 ' + score;
          bump(scoreEl);
          playSound('pop');
          m.classList.add('is-caught');
          s.timeout(removeM, reduced ? 0 : 180);
        });
      }

      // Со временем мышки появляются чаще.
      var elapsed2 = now() - startT;
      var nextDelay = reduced ? 900 : (860 - Math.min(470, (elapsed2 / DUR) * 470));
      s.timeout(spawn, nextDelay + Math.random() * 180);
    }

    s.timeout(spawn, 400);
  }

  /* ======================= игра 2: «Рыбалка» ======================= */
  function runFish(def, host, onDone) {
    teardown();
    _host = host;
    _mode = 'game';
    var s = makeSession(host);
    _session = s;
    clearHost(host);

    var reduced = reducedMotion();
    var round = 0, score = 0, locked = false;
    var zc = 0.5, hw = 0.15, speed = 0.6, phaseStart = now();

    var root = el('div', 'mg-root mg-fish');

    var head = el('div', 'mg-head');
    var statusEl = el('div', 'mg-status');
    var scoreEl = el('div', 'mg-score');
    scoreEl.textContent = '🐟 0';
    head.appendChild(statusEl);
    head.appendChild(scoreEl);

    var track = el('div', 'mg-track');
    var zone = el('div', 'mg-zone');
    var marker = el('div', 'mg-marker');
    track.appendChild(zone);
    track.appendChild(marker);

    var msg = el('div', 'mg-msg');

    var cast = el('button', 'mg-btn mg-btn-primary mg-cast');
    cast.type = 'button';
    cast.textContent = 'Подсечь!';

    root.appendChild(head);
    root.appendChild(track);
    root.appendChild(msg);
    root.appendChild(cast);
    host.appendChild(root);

    // Текущее положение поплавка (0..1), «пила» вперёд-назад по времени.
    function frac() {
      var t = (now() - phaseStart) / 1000;
      var phase = (t * speed) % 2;
      if (phase < 0) phase += 2;
      return phase < 1 ? phase : 2 - phase;
    }

    function loop() {
      if (!s.alive() || locked) return;
      marker.style.left = (frac() * 100) + '%';
      s.raf(loop);
    }

    function setupRound() {
      locked = false;
      round++;
      if (round > FISH_ROUNDS) { finishGame(host, def, score, onDone); return; }

      var prog = (round - 1) / (FISH_ROUNDS - 1 || 1); // 0..1
      hw = 0.17 - prog * 0.115;          // зона сужается: ~0.17 -> ~0.055
      speed = 0.55 + prog * 0.65;        // поплавок ускоряется
      zc = 0.15 + Math.random() * 0.70;
      zc = Math.min(1 - hw, Math.max(hw, zc)); // держим зону внутри шкалы

      zone.style.left = ((zc - hw) * 100) + '%';
      zone.style.width = ((hw * 2) * 100) + '%';

      statusEl.textContent = 'Раунд ' + round + ' / ' + FISH_ROUNDS;
      msg.textContent = 'Тапни в зелёной зоне';
      msg.className = 'mg-msg';
      marker.classList.remove('is-hit', 'is-miss');

      phaseStart = now();
      loop();
    }

    function attempt() {
      if (locked) return;
      locked = true;
      var f = frac();
      var hit = Math.abs(f - zc) <= hw;
      if (hit) {
        score++;
        playSound('coin');
        msg.textContent = 'Есть рыбка! 🐟';
        msg.className = 'mg-msg mg-ok';
        marker.classList.add('is-hit');
      } else {
        playSound('error');
        msg.textContent = 'Мимо…';
        msg.className = 'mg-msg mg-bad';
        marker.classList.add('is-miss');
      }
      scoreEl.textContent = '🐟 ' + score;
      bump(scoreEl);
      s.timeout(setupRound, reduced ? 500 : 800);
    }

    s.on(cast, 'pointerdown', function (ev) { ev.preventDefault(); attempt(); });
    s.on(track, 'pointerdown', function (ev) { ev.preventDefault(); attempt(); });

    setupRound();
  }

  /* ======================= игра 3: «Клубок» (память) ======================= */
  function runYarn(def, host, onDone) {
    teardown();
    _host = host;
    _mode = 'game';
    var s = makeSession(host);
    _session = s;
    clearHost(host);

    var reduced = reducedMotion();
    var PADS = 4;
    var seq = [];
    var input = 0;
    var level = 0;
    var accepting = false;

    var root = el('div', 'mg-root mg-yarn');

    var head = el('div', 'mg-head');
    var statusEl = el('div', 'mg-status');
    var scoreEl = el('div', 'mg-score');
    head.appendChild(statusEl);
    head.appendChild(scoreEl);

    var grid = el('div', 'mg-pads');
    var pads = [];
    for (var i = 0; i < PADS; i++) {
      var p = el('button', 'mg-pad mg-pad-' + i);
      p.type = 'button';
      p.textContent = '🧶';
      grid.appendChild(p);
      pads.push(p);
      (function (idx) {
        s.on(pads[idx], 'pointerdown', function (ev) { ev.preventDefault(); press(idx); });
      })(i);
    }

    var msg = el('div', 'mg-msg');

    root.appendChild(head);
    root.appendChild(msg);
    root.appendChild(grid);
    host.appendChild(root);

    function flash(idx, on) { pads[idx].classList.toggle('is-lit', on); }

    function nextLevel() {
      level++;
      input = 0;
      accepting = false;
      if (level > YARN_MAX) { finishGame(host, def, level - 1, onDone); return; }
      statusEl.textContent = 'Уровень ' + level;
      scoreEl.textContent = '🧶 ' + (level - 1);
      seq.push(Math.floor(Math.random() * PADS));
      msg.textContent = 'Смотри…';
      msg.className = 'mg-msg';
      playSeq();
    }

    function playSeq() {
      var i = 0;
      var onT = reduced ? 300 : 430;
      var offT = reduced ? 170 : 230;
      function step() {
        if (!s.alive()) return;
        if (i >= seq.length) {
          accepting = true;
          msg.textContent = 'Повторяй!';
          msg.className = 'mg-msg';
          return;
        }
        var idx = seq[i];
        flash(idx, true);
        playSound('pop');
        s.timeout(function () {
          flash(idx, false);
          i++;
          s.timeout(step, offT);
        }, onT);
      }
      s.timeout(step, reduced ? 350 : 600);
    }

    function press(idx) {
      if (!accepting) return;
      flash(idx, true);
      playSound('click');
      s.timeout(function () { flash(idx, false); }, 150);

      if (idx === seq[input]) {
        input++;
        if (input >= seq.length) {
          // Уровень пройден.
          accepting = false;
          playSound('win');
          msg.textContent = 'Верно! 🎉';
          msg.className = 'mg-msg mg-ok';
          s.timeout(nextLevel, reduced ? 500 : 850);
        }
      } else {
        // Ошибка — конец игры. Счёт = число полностью пройденных уровней.
        accepting = false;
        playSound('error');
        msg.textContent = 'Ошибка!';
        msg.className = 'mg-msg mg-bad';
        pads[idx].classList.add('is-wrong');
        var reachedScore = level - 1;
        s.timeout(function () { finishGame(host, def, reachedScore, onDone); }, reduced ? 650 : 1000);
      }
    }

    nextLevel(); // старт с уровня 1
  }

  /* ======================= публичный API ======================= */
  var MiniGames = {
    // Список игр для меню/навигации.
    list: function () {
      return GAMES.map(function (g) {
        return { id: g.id, name: g.name, emoji: g.emoji, desc: g.desc };
      });
    },

    // Нарисовать меню выбора мини-игр в контейнер (экран «Игры»).
    mount: function (containerEl) {
      if (!containerEl) return;
      renderMenu(containerEl);
    },

    // Запустить игру gameId в hostEl. По завершении: reward(id,score) -> onDone(score).
    start: function (gameId, hostEl, onDone) {
      if (!hostEl) return;
      launch(gameId, hostEl, onDone, false);
    },

    // Остановить и очистить текущую игру/экран (снять все таймеры/RAF/слушатели).
    stop: function () {
      teardown();
      if (_host && _mode && _mode !== 'menu') clearHost(_host);
      _mode = null;
    }
  };

  window.MiniGames = MiniGames;
})();

</script>

<script>
/* ===== js/cat.js ===== */
/* js/cat.js — window.CatView (владелец: jim).
   Рисует котёнка (CSS-формы «тело» + текстовые/эмодзи акценты) и ЖИВОЙ МИР
   комнаты: небо и цикл день/ночь, солнце/луна/звёзды/облака, пол, слой мебели
   (equipped.decor), фон-водяной знак (equipped.bg), лёгкая погода и амбиент-гости
   (бабочка/птичка). Меняет позу/мордочку по happiness/energy (4 настроения),
   размер/пропорции по state.stage (kitten/teen/adult), показывает индикатор
   болезни (state.sick). Реагирует на события CatGame анимациями и богатыми
   частицами; звук — ТОЛЬКО через window.CatAudio.play(...) (движок god, §7),
   мьютинг он делает сам по state.settings.sound. Никакого localStorage,
   доступ к CatGame — только через документированный API (§3). Стили и
   @keyframes — в css/cat.css (namespace .cv-). Реализовано по CONTRACT.md §4/§5/§6.

   v2.1 (итерация 2):
   - idle-поведение: помимо дыхания/моргания — потягивание, умывание лапкой,
     зевота, флик хвостом/ухом, смена позы «лоаф», взгляд за пролетающим гостем
     (data-look на .cv-cat). Рандомный ненавязчивый ритм, таймеры чистятся,
     уважается prefers-reduced-motion.
   - рендер owned-компаньонов (§15b): мини-котята из CSS-форм, тонированные
     fur/accent, гуляют/сидят по комнате; появляются по 'companion:adopt' с
     анимацией; изредка мяукают (CatAudio.play('meowbaby')). Диффаются по id. */
(function () {
  'use strict';

  // ---------- маленькие утилиты ----------
  function num(v, fallback) { return (typeof v === 'number' && !isNaN(v)) ? v : fallback; }
  function clamp01(v) { v = num(v, 0.5); return Math.max(0, Math.min(1, v)); }
  function ce(tag, cls) { var el = document.createElement(tag); if (cls) el.className = cls; return el; }
  function findItem(itemId) {
    if (!itemId) return null;
    var list = window.CatItems || [];
    for (var i = 0; i < list.length; i++) { if (list[i].id === itemId) return list[i]; }
    return null;
  }
  // стабильный хеш строки id (для детерминированных окраса-независимых параметров компаньона)
  function hashId(id) {
    var h = 0, s = String(id || '');
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- звук: только вызовы CatAudio (движок god, §7) ----------
  // CatAudio сам мьютится по state.settings.sound — просто зовём и не падаем,
  // если модуль ещё не готов.
  function sfx(name) {
    try { if (window.CatAudio && typeof CatAudio.play === 'function') CatAudio.play(name); } catch (e) { /* тихо */ }
  }
  function audioResume() {
    try { if (window.CatAudio && typeof CatAudio.resume === 'function') CatAudio.resume(); } catch (e) { /* тихо */ }
  }

  // ---------- состояние модуля ----------
  var stageEl = null;      // корневой div «комнаты», переданный в mount()
  var mounted = false;
  var subscribed = false;

  // ссылки на DOM-узлы, которые мы построили
  var skyEl, sunEl, moonEl, starsEl, cloudsEl, floorEl, veilEl,
      bgEl, decorEl, weatherEl, guestsEl, companionsEl, poopsEl,
      catWrapEl, shadowEl, toyEl, statusEl, sickBadgeEl, catEl,
      tailEl, bodyEl, outfitEl, pawLEl, pawREl, bowlEl,
      headEl, earLEl, earREl, hatEl, faceEl,
      eyeLEl, eyeREl, blushLEl, blushREl, noseEl, mouthEl,
      whiskLEl, whiskREl, washPawEl, collarEl, fxEl;

  var poopNodes = {};      // id -> DOM-узел какашки (для диффа без мигания)
  var companionNodes = {}; // id -> DOM-узел компаньона (для диффа без мигания)
  var lastBgId = undefined;
  var lastDecorId = undefined;
  var lastStage = undefined;
  var lastSick = undefined;
  var lastNight = undefined;
  var timers = {};         // ключ анимации -> timeoutId (для transient-классов главного котёнка)
  var ambientTimer = null; // общий тик амбиента (zzz + редкий мяв компаньона)
  var idleTimer = null;    // планировщик idle-микродействий главного котёнка
  var guestTimer = null;   // планировщик гостей
  var weatherTimer = null; // планировщик погоды
  var lookTimer = null;    // сброс взгляда за гостем (data-look)
  var busyUntil = 0;       // до этого времени idle не запускаем (идёт действие/анимация)

  // ---------- построение DOM (один раз, при mount) ----------
  function buildDom(root) {
    root.innerHTML = '';
    root.classList.add('cv-stage');

    // --- слои мира (z-index задаётся в css) ---
    skyEl = ce('div', 'cv-sky');
    sunEl = ce('div', 'cv-sun'); sunEl.textContent = '☀️';
    moonEl = ce('div', 'cv-moon'); moonEl.textContent = '🌙';
    starsEl = ce('div', 'cv-stars');
    cloudsEl = ce('div', 'cv-clouds');
    skyEl.appendChild(cloudsEl);
    skyEl.appendChild(starsEl);
    skyEl.appendChild(sunEl);
    skyEl.appendChild(moonEl);

    bgEl = ce('div', 'cv-bg');
    floorEl = ce('div', 'cv-floor');
    decorEl = ce('div', 'cv-decor');
    veilEl = ce('div', 'cv-veil');
    weatherEl = ce('div', 'cv-weather');
    guestsEl = ce('div', 'cv-guests');
    companionsEl = ce('div', 'cv-companions');
    poopsEl = ce('div', 'cv-poops');

    buildStars(16);
    buildClouds(3);

    // --- котёнок ---
    catWrapEl = ce('div', 'cv-catwrap');
    catWrapEl.setAttribute('role', 'button');
    catWrapEl.setAttribute('tabindex', '0');
    catWrapEl.setAttribute('aria-label', 'Погладить котёнка');

    shadowEl = ce('div', 'cv-shadow');
    toyEl = ce('div', 'cv-toy');
    statusEl = ce('div', 'cv-status');

    catEl = ce('div', 'cv-cat');
    catEl.setAttribute('data-mood', 'calm');

    tailEl = ce('div', 'cv-tail');

    bodyEl = ce('div', 'cv-body');
    outfitEl = ce('div', 'cv-outfit');
    pawLEl = ce('div', 'cv-paw cv-paw-l');
    pawREl = ce('div', 'cv-paw cv-paw-r');
    bowlEl = ce('div', 'cv-bowl');
    bowlEl.textContent = '🍚';
    bodyEl.appendChild(outfitEl);
    bodyEl.appendChild(pawLEl);
    bodyEl.appendChild(pawREl);
    bodyEl.appendChild(bowlEl);

    headEl = ce('div', 'cv-head');
    earLEl = ce('div', 'cv-ear cv-ear-l');
    earLEl.appendChild(ce('i', 'cv-ear-inner'));
    earREl = ce('div', 'cv-ear cv-ear-r');
    earREl.appendChild(ce('i', 'cv-ear-inner'));
    hatEl = ce('div', 'cv-hat');
    washPawEl = ce('div', 'cv-washpaw');
    collarEl = ce('div', 'cv-collar');
    sickBadgeEl = ce('div', 'cv-sickbadge');
    sickBadgeEl.textContent = '🤒';

    faceEl = ce('div', 'cv-face');
    eyeLEl = ce('div', 'cv-eye cv-eye-l');
    eyeREl = ce('div', 'cv-eye cv-eye-r');
    blushLEl = ce('div', 'cv-blush cv-blush-l');
    blushREl = ce('div', 'cv-blush cv-blush-r');
    noseEl = ce('div', 'cv-nose');
    mouthEl = ce('div', 'cv-mouth');
    whiskLEl = ce('div', 'cv-whisk cv-whisk-l');
    whiskREl = ce('div', 'cv-whisk cv-whisk-r');
    faceEl.appendChild(eyeLEl); faceEl.appendChild(eyeREl);
    faceEl.appendChild(blushLEl); faceEl.appendChild(blushREl);
    faceEl.appendChild(noseEl); faceEl.appendChild(mouthEl);
    faceEl.appendChild(whiskLEl); faceEl.appendChild(whiskREl);

    headEl.appendChild(earLEl);
    headEl.appendChild(earREl);
    headEl.appendChild(faceEl);
    headEl.appendChild(washPawEl);
    headEl.appendChild(hatEl);
    headEl.appendChild(collarEl);
    headEl.appendChild(sickBadgeEl);

    catEl.appendChild(tailEl);
    catEl.appendChild(bodyEl);
    catEl.appendChild(headEl);

    catWrapEl.appendChild(shadowEl);
    catWrapEl.appendChild(toyEl);
    catWrapEl.appendChild(statusEl);
    catWrapEl.appendChild(catEl);

    fxEl = ce('div', 'cv-fx');

    // порядок в DOM для наглядности (реальный порядок отрисовки — по z-index)
    root.appendChild(skyEl);
    root.appendChild(bgEl);
    root.appendChild(floorEl);
    root.appendChild(decorEl);
    root.appendChild(companionsEl);
    root.appendChild(poopsEl);
    root.appendChild(catWrapEl);
    root.appendChild(veilEl);
    root.appendChild(weatherEl);
    root.appendChild(guestsEl);
    root.appendChild(fxEl);

    bindDomEvents();
    pulseClass(catWrapEl, 'is-entering', 550);
  }

  // --- генерация статичных звёзд (позиции случайны, но узлы — один раз) ---
  function buildStars(n) {
    starsEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var s = ce('i', 'cv-star');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      var sc = 0.7 + Math.random() * 1.1;
      s.style.transform = 'scale(' + sc.toFixed(2) + ')';
      s.style.animationDelay = (Math.random() * 2.6).toFixed(2) + 's';
      s.style.animationDuration = (2 + Math.random() * 2).toFixed(2) + 's';
      starsEl.appendChild(s);
    }
  }
  // --- облака, дрейфующие с разной скоростью/высотой (параллакс) ---
  function buildClouds(n) {
    cloudsEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var c = ce('span', 'cv-cloud');
      c.textContent = '☁️';
      c.style.top = (6 + Math.random() * 34) + '%';
      c.style.fontSize = (26 + Math.random() * 26) + 'px';
      var dur = 34 + Math.random() * 40;      // разная скорость => параллакс
      c.style.animationDuration = dur.toFixed(1) + 's';
      c.style.animationDelay = '-' + (Math.random() * dur).toFixed(1) + 's';
      c.style.opacity = (0.75 + Math.random() * 0.2).toFixed(2);
      cloudsEl.appendChild(c);
    }
  }

  function bindDomEvents() {
    function pet() {
      audioResume();  // первый user-gesture внутри сцены разблокирует WebAudio
      if (window.CatGame && CatGame.actions && CatGame.actions.pet) CatGame.actions.pet();
    }
    catWrapEl.addEventListener('click', pet);
    catWrapEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); pet(); }
    });

    poopsEl.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('.poop') : null;
      if (!el) return;
      var id = el.getAttribute('data-id');
      var x = parseFloat(el.style.left);
      var y = parseFloat(el.style.top);
      spawnCleanFx(x, y);
      sfx('pop');
      if (window.CatGame && CatGame.actions && CatGame.actions.cleanPoop) {
        CatGame.actions.cleanPoop(id);
      }
    });
  }

  // ---------- transient CSS-классы для анимаций (главный котёнок) ----------
  function pulseClass(el, cls, ms) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth; // форс-reflow, чтобы анимация перезапустилась при повторе
    el.classList.add(cls);
    clearTimeout(timers[cls]);
    timers[cls] = setTimeout(function () { el.classList.remove(cls); }, ms);
  }
  // transient-класс на произвольном элементе (компаньоны) — свой таймер на узле,
  // чтобы несколько котят не гасили класс друг другу.
  function pulseOn(el, cls, ms) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(function () { if (el) el.classList.remove(cls); }, ms);
  }

  // «занятость» — чтобы idle не наслаивался на действия/анимации
  function markBusy(ms) { busyUntil = Date.now() + (ms || 0); }
  function isBusy() { return Date.now() < busyUntil; }

  // ---------- рендер по CatGame.state ----------
  function render() {
    if (!mounted || !window.CatGame) return;
    var state = CatGame.state || {};
    applyStage(state);
    applySick(state);
    applyMood(state);
    renderStatus(state);
    renderEquipped(state);
    renderPoops(state.poops || []);
    renderCompanions();
    applyDayNight(CatGame.isNight ? CatGame.isNight() : false, false);
    updateName(state);
  }

  // рост по стадиям: масштаб/пропорции котёнка (kitten<teen<adult)
  function applyStage(state) {
    var stage = state.stage;
    if (stage !== 'kitten' && stage !== 'teen' && stage !== 'adult') {
      // подстрахуемся, выведя стадию из уровня по контракту §4
      var lvl = num(state.level, 1);
      stage = lvl >= 15 ? 'adult' : (lvl >= 5 ? 'teen' : 'kitten');
    }
    if (lastStage === stage) return;
    lastStage = stage;
    catWrapEl.setAttribute('data-stage', stage);
  }

  // болезнь: вялый котёнок + значок недомогания
  function applySick(state) {
    var sick = !!state.sick;
    if (lastSick === sick) return;
    lastSick = sick;
    catWrapEl.classList.toggle('is-sick', sick);
    sickBadgeEl.classList.toggle('is-on', sick);
  }

  function applyMood(state) {
    var happiness = num(state.happiness, 80);
    var energy = num(state.energy, 80);
    var mood = 'calm';
    if (energy <= 15) mood = 'sleepy';
    else if (happiness >= 70) mood = 'happy';
    else if (happiness <= 25) mood = 'sad';
    if (catEl.getAttribute('data-mood') !== mood) catEl.setAttribute('data-mood', mood);
  }

  function renderStatus(state) {
    var hunger = num(state.hunger, 80), hygiene = num(state.hygiene, 80);
    var icon = '';
    if (hunger <= 20 && hunger <= hygiene) icon = '🍗';
    else if (hygiene <= 20) icon = '💧';
    if (statusEl.textContent !== icon) statusEl.textContent = icon;
    statusEl.classList.toggle('is-on', !!icon);
  }

  function updateName(state) {
    var name = (state && state.name) ? String(state.name) : 'котёнка';
    var label = 'Погладить ' + name;
    if (catWrapEl.getAttribute('aria-label') !== label) catWrapEl.setAttribute('aria-label', label);
  }

  function setSlot(el, itemId) {
    if (!el) return;
    var item = itemId ? findItem(itemId) : null;
    if (item) {
      if (el.textContent !== item.emoji) el.textContent = item.emoji;
      el.classList.add('is-on');
      el.title = item.name || '';
    } else {
      if (el.textContent) el.textContent = '';
      el.classList.remove('is-on');
      el.removeAttribute('title');
    }
  }

  function renderEquipped(state) {
    var eq = (state && state.equipped) || {};
    setSlot(hatEl, eq.hat);
    setSlot(collarEl, eq.collar);
    setSlot(outfitEl, eq.outfit);
    setSlot(toyEl, eq.toy);
    renderBg(eq.bg || null);
    renderDecor(eq.decor || null);
  }

  // фон комнаты — «водяной знак» из эмодзи выбранного bg-предмета
  var BG_LAYOUT = [
    { x: 8, y: 10, s: 34, r: -12 }, { x: 80, y: 14, s: 44, r: 10 },
    { x: 18, y: 55, s: 28, r: 8 }, { x: 86, y: 58, s: 36, r: -8 },
    { x: 48, y: 6, s: 24, r: 0 }, { x: 60, y: 68, s: 30, r: 15 },
    { x: 4, y: 76, s: 22, r: -15 }
  ];
  function renderBg(itemId) {
    if (lastBgId === itemId) return;
    lastBgId = itemId;
    bgEl.innerHTML = '';
    var item = itemId ? findItem(itemId) : null;
    if (!item) { bgEl.classList.remove('is-on'); return; }
    bgEl.classList.add('is-on');
    BG_LAYOUT.forEach(function (p) {
      var span = document.createElement('span');
      span.textContent = item.emoji;
      span.style.left = p.x + '%';
      span.style.top = p.y + '%';
      span.style.fontSize = p.s + 'px';
      span.style.transform = 'rotate(' + p.r + 'deg)';
      bgEl.appendChild(span);
    });
  }

  // мебель комнаты (новый слот decor) — стоит на полу слева
  function renderDecor(itemId) {
    if (lastDecorId === itemId) return;
    lastDecorId = itemId;
    var item = itemId ? findItem(itemId) : null;
    if (!item) {
      decorEl.classList.remove('is-on');
      decorEl.removeAttribute('title');
      decorEl.textContent = '';
      return;
    }
    decorEl.textContent = item.emoji;
    decorEl.title = item.name || '';
    decorEl.classList.add('is-on');
  }

  // какашки: диффим по id, чтобы не переигрывать анимацию появления зря
  function renderPoops(poops) {
    var seen = {};
    (poops || []).forEach(function (p) {
      if (!p || !p.id) return;
      seen[p.id] = true;
      var el = poopNodes[p.id];
      if (!el) {
        el = document.createElement('button');
        el.type = 'button';
        el.className = 'poop poop--spawn';
        el.setAttribute('data-id', p.id);
        el.setAttribute('aria-label', 'Убрать какашку');
        el.textContent = '💩';
        poopsEl.appendChild(el);
        poopNodes[p.id] = el;
        (function (node) {
          setTimeout(function () { node.classList.remove('poop--spawn'); }, 520);
        })(el);
      }
      el.style.left = (clamp01(p.x) * 100) + '%';
      el.style.top = (clamp01(p.y) * 100) + '%';
    });
    Object.keys(poopNodes).forEach(function (id) {
      if (!seen[id]) {
        var el = poopNodes[id];
        delete poopNodes[id];
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
    });
  }

  // ---------- котята-компаньоны (§15b) ----------
  // слоты-позиции по полу (left %, bottom %), в стороне от главного котёнка (центр)
  var COMP_SLOTS = [
    { x: 20, y: 5 }, { x: 82, y: 7 }, { x: 32, y: 2 },
    { x: 70, y: 3 }, { x: 10, y: 13 }, { x: 90, y: 11 }
  ];
  // выбрать первый свободный слот (стабильно, без наложений между котятами)
  function pickCompSlot() {
    var used = {};
    Object.keys(companionNodes).forEach(function (id) {
      var s = companionNodes[id] && companionNodes[id].getAttribute('data-slot');
      if (s != null) used[s] = true;
    });
    for (var i = 0; i < COMP_SLOTS.length; i++) { if (!used[i]) return i; }
    return Math.floor(Math.random() * COMP_SLOTS.length);
  }

  // построить мини-котёнка из CSS-форм, тонированного fur/accent
  function buildCompanion(id, data) {
    var wrap = ce('div', 'cv-comp');
    wrap.setAttribute('data-id', id);
    var fur = (data && data.fur) || '#f5b98a';
    var accent = (data && data.accent) || '#e08f57';
    wrap.style.setProperty('--cf', fur);
    wrap.style.setProperty('--ca', accent);

    var h = hashId(id);
    var scale = (0.8 + (h % 22) / 100).toFixed(2);   // 0.80..1.01 — мельче главного
    wrap.style.setProperty('--cs', scale);

    var slot = pickCompSlot();
    wrap.setAttribute('data-slot', String(slot));
    var pos = COMP_SLOTS[slot] || COMP_SLOTS[0];
    wrap.style.left = pos.x + '%';
    wrap.style.bottom = pos.y + '%';

    // поведение: часть гуляет, часть сидит (детерминированно по id, стабильно)
    var walk = (h % 5) < 3;
    var wt = 8 + (h % 8);                              // период прогулки 8..15с
    wrap.style.setProperty('--wt', wt + 's');
    wrap.classList.add(walk ? 'is-walk' : 'is-sit');

    var shadow = ce('div', 'cv-comp-shadow');
    var inner = ce('div', 'cv-comp-inner');
    // рассинхрон анимаций между котятами
    inner.style.animationDelay = '-' + (h % Math.max(1, wt)) + 's';
    inner.style.setProperty('--bd', ((h % 40) / 10).toFixed(1) + 's');

    var tail = ce('div', 'cv-comp-tail');
    var body = ce('div', 'cv-comp-body');
    var head = ce('div', 'cv-comp-head');
    var earL = ce('i', 'cv-comp-ear cv-comp-ear-l');
    var earR = ce('i', 'cv-comp-ear cv-comp-ear-r');
    var stripe = ce('i', 'cv-comp-stripe');
    var eyeL = ce('i', 'cv-comp-eye cv-comp-eye-l');
    var eyeR = ce('i', 'cv-comp-eye cv-comp-eye-r');
    var nose = ce('i', 'cv-comp-nose');
    head.appendChild(earL); head.appendChild(earR); head.appendChild(stripe);
    head.appendChild(eyeL); head.appendChild(eyeR); head.appendChild(nose);
    inner.appendChild(tail); inner.appendChild(body); inner.appendChild(head);
    wrap.appendChild(shadow); wrap.appendChild(inner);

    wrap.title = (data && data.name) ? data.name : String(id);

    // появление с анимацией (класс снимаем, чтобы дальше играли обычные idle-анимации)
    if (!reduceMotion) {
      wrap.classList.add('is-arriving');
      setTimeout(function () { if (wrap) wrap.classList.remove('is-arriving'); }, 720);
    }
    return wrap;
  }

  // рендер owned-компаньонов: идемпотентно, диффаем по id (без миганий)
  function renderCompanions() {
    if (!companionsEl || !window.CatGame || !CatGame.companions || !CatGame.companions.list) return;
    var ids = [];
    try { ids = CatGame.companions.list() || []; } catch (e) { ids = []; }
    var seen = {};
    ids.forEach(function (id) {
      if (!id) return;
      seen[id] = true;
      if (companionNodes[id]) return;  // уже нарисован — не трогаем (без мигания)
      var data = null;
      try { data = CatGame.companions.find ? CatGame.companions.find(id) : null; } catch (e) { data = null; }
      var node = buildCompanion(id, data);
      companionsEl.appendChild(node);
      companionNodes[id] = node;
    });
    Object.keys(companionNodes).forEach(function (id) {
      if (!seen[id]) {
        var el = companionNodes[id];
        delete companionNodes[id];
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
    });
  }

  // редкий мяв компаньона (малышовый), шанс в амбиент-таймере — не спамить
  function maybeCompanionMew() {
    var ids = Object.keys(companionNodes);
    if (!ids.length) return;
    if (Math.random() >= 0.06) return;
    sfx('meowbaby');
    var node = companionNodes[ids[Math.floor(Math.random() * ids.length)]];
    if (!node) return;
    if (!reduceMotion) pulseOn(node, 'is-mew', 700);
    // нотка над мяукнувшим котёнком (перевод bottom% -> top% приблизительно)
    var lx = parseFloat(node.style.left) || 50;
    var by = parseFloat(node.style.bottom) || 6;
    floatParticle('♪', lx, Math.max(6, 100 - by - 22), { driftX: 8, duration: 1100, size: 15 });
  }

  // ---------- день/ночь: освещение сцены (звёзды/солнце/луна/веаль) ----------
  function applyDayNight(night, force) {
    night = !!night;
    if (!force && lastNight === night) return;
    lastNight = night;
    if (stageEl) stageEl.setAttribute('data-daynight', night ? 'night' : 'day');
  }

  // ---------- частицы (сердечки/ноты/пузыри/искры/zzz) ----------
  function floatParticle(text, x, y, opts) {
    opts = opts || {};
    var el = document.createElement('span');
    el.className = 'cv-particle';
    el.textContent = text;
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.setProperty('--drift', (opts.driftX || 0) + 'px');
    el.style.setProperty('--dur', (opts.duration || 1300) + 'ms');
    el.style.fontSize = (opts.size || 20) + 'px';
    fxEl.appendChild(el);
    var cleanup = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    el.addEventListener('animationend', cleanup);
    setTimeout(cleanup, (opts.duration || 1300) + 400);
  }
  // сколько частиц выпустить с учётом prefers-reduced-motion
  function burstN(n) { return reduceMotion ? Math.min(1, n) : n; }

  function fxPet() {
    var items = ['❤', '💗', '💕', '♪', '✨'];
    var n = burstN(5);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle(items[i % items.length], 40 + Math.random() * 18, 26 + Math.random() * 10, {
            driftX: (Math.random() * 34 - 17), duration: 1100 + Math.random() * 400, size: 16 + Math.random() * 12
          });
        }, i * 100);
      })(i);
    }
  }
  function fxBubbles() {
    var n = burstN(6);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle(Math.random() > 0.5 ? '🫧' : '💧', 28 + Math.random() * 44, 34 + Math.random() * 16, {
            driftX: (Math.random() * 28 - 14), duration: 1200 + Math.random() * 400, size: 12 + Math.random() * 12
          });
        }, i * 140);
      })(i);
    }
  }
  function fxCrumbs() {
    var n = burstN(4);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle(Math.random() > 0.5 ? '✨' : '😋', 42 + Math.random() * 16, 58 + Math.random() * 10, {
            driftX: (Math.random() * 22 - 11), duration: 700 + Math.random() * 300, size: 13 + Math.random() * 6
          });
        }, i * 160);
      })(i);
    }
  }
  function fxPlaySparkle() {
    var notes = ['💫', '✨', '🎵', '🎶', '⭐'];
    var n = burstN(5);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle(notes[Math.floor(Math.random() * notes.length)], 28 + Math.random() * 44, 22 + Math.random() * 22, {
            driftX: (Math.random() * 44 - 22), duration: 900 + Math.random() * 400, size: 14 + Math.random() * 10
          });
        }, i * 150);
      })(i);
    }
  }
  function fxZzzOnce() {
    floatParticle('z', 62 + Math.random() * 6, 14, { driftX: 14, duration: 1800, size: 20 });
  }
  function fxZzzBurst() {
    var sizes = [16, 22, 28, 20];
    var n = burstN(4);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle('z', 60 + i * 4, 16 - i * 4, { driftX: 10 + i * 6, duration: 1500 + i * 200, size: sizes[i % sizes.length] });
        }, i * 240);
      })(i);
    }
  }
  function fxHeal() {
    var items = ['💚', '✨', '➕', '🌿', '💊'];
    var n = burstN(6);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle(items[i % items.length], 36 + Math.random() * 26, 24 + Math.random() * 18, {
            driftX: (Math.random() * 34 - 17), duration: 1100 + Math.random() * 400, size: 15 + Math.random() * 10
          });
        }, i * 120);
      })(i);
    }
  }
  function fxCelebrate(kind) {
    // общая радость для level:up / stage:change / companion:adopt
    var items = kind === 'stage' ? ['🎉', '⭐', '✨', '🌟', '🎊']
      : (kind === 'adopt' ? ['❤', '💕', '✨', '🐾', '🌟'] : ['🌟', '✨', '⬆️', '💛']);
    var n = burstN(7);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle(items[Math.floor(Math.random() * items.length)], 30 + Math.random() * 40, 20 + Math.random() * 22, {
            driftX: (Math.random() * 50 - 25), duration: 1200 + Math.random() * 500, size: 16 + Math.random() * 12
          });
        }, i * 110);
      })(i);
    }
  }
  function spawnCleanFx(xPct, yPct) {
    floatParticle('🧹', xPct, yPct, { duration: 500, size: 22 });
    var n = burstN(3);
    for (var i = 0; i < n; i++) {
      (function (i) {
        setTimeout(function () {
          floatParticle('✨', xPct + (Math.random() * 14 - 7), yPct - Math.random() * 6, {
            driftX: (Math.random() * 24 - 12), duration: 600 + Math.random() * 200, size: 14
          });
        }, 60 + i * 70);
      })(i);
    }
  }

  // ---------- обработчики событий действий ----------
  function onActionPet() {
    render();
    pulseClass(catWrapEl, 'is-petting', 900); markBusy(900);
    fxPet();
    sfx('purr');
  }
  function onActionWash() {
    render();
    pulseClass(catWrapEl, 'is-washing', 1400); markBusy(1400);
    fxBubbles();
    sfx('wash');
  }
  function onActionFeed() {
    render();
    pulseClass(catWrapEl, 'is-eating', 1600); markBusy(1600);
    fxCrumbs();
    sfx('eat');
  }
  function onActionPlay() {
    render();
    pulseClass(catWrapEl, 'is-playing', 1500); markBusy(1500);
    fxPlaySparkle();
    sfx('play');
  }
  function onActionSleep() {
    render();
    pulseClass(catWrapEl, 'is-sleeping', 1800); markBusy(1800);

  function onActionHeal() {

    pulseClass(catWrapEl, 'is-healing', 1200); markBusy(1200);
