  function onStageChange() {
    render();               // переставит data-stage → новый масштаб/пропорции
    pulseClass(catWrapEl, 'is-growing', 850); markBusy(850);
    fxCelebrate('stage');
  }
  function onLevelUp() {
    fxCelebrate('level');   // мелкая радость (звук уровня играет god)
  }
  function onDayNight(data) {
    applyDayNight(data && typeof data.night !== 'undefined' ? data.night
      : (CatGame.isNight ? CatGame.isNight() : false), true);
  }
  function onName() {
    if (window.CatGame) updateName(CatGame.state || {});
  }
  // новый котёнок-компаньон заведён — появляется с анимацией + малышовый мяв + радость
  function onCompanionAdopt(data) {
    renderCompanions();          // дифф создаст новый узел с is-arriving
    sfx('meowbaby');
    fxCelebrate('adopt');
  }

  // ---------- взгляд за гостем (data-look на .cv-cat) ----------
  function setLook(dir) {
    if (reduceMotion || !catEl) return;
    if (isBusy()) return;                                   // не перебиваем действие/idle
    if (catEl.getAttribute('data-mood') === 'sleepy') return;
    catEl.setAttribute('data-look', dir);
    clearTimeout(lookTimer);
    lookTimer = setTimeout(function () { if (catEl) catEl.removeAttribute('data-look'); }, 2600);
  }

  // ---------- idle-поведение главного котёнка (микродействия без игрока) ----------
  // вес w влияет на частоту; ms — длительность (и «занятость» на это время)
  var IDLE_ACTS = [
    { cls: 'is-tailflick', ms: 700, w: 5 },
    { cls: 'is-eartwitch', ms: 520, w: 5 },
    { cls: 'is-stretch', ms: 1400, w: 3 },
    { cls: 'is-grooming', ms: 1500, w: 3 },
    { cls: 'is-yawn', ms: 1100, w: 2 },
    { cls: 'is-loaf', ms: 4600, w: 2 }
  ];
  var IDLE_TOTAL = (function () { var t = 0; for (var i = 0; i < IDLE_ACTS.length; i++) t += IDLE_ACTS[i].w; return t; })();
  function pickIdle() {
    var r = Math.random() * IDLE_TOTAL, acc = 0;
    for (var i = 0; i < IDLE_ACTS.length; i++) { acc += IDLE_ACTS[i].w; if (r < acc) return IDLE_ACTS[i]; }
    return IDLE_ACTS[0];
  }
  function scheduleIdle() {
    clearTimeout(idleTimer);
    var delay = 4800 + Math.random() * 7200;   // ненавязчивый ритм ~4.8–12с
    idleTimer = setTimeout(function () { doIdle(); scheduleIdle(); }, delay);
  }
  function doIdle() {
    if (!mounted || document.hidden || !catEl) return;
    var mood = catEl.getAttribute('data-mood');
    if (mood === 'sleepy') return;             // спит — zzz даёт ambientTimer
    if (isBusy()) return;                       // идёт другое действие/анимация
    if (lastSick) {                             // болен — только вялый флик хвостом
      if (Math.random() < 0.5) { pulseClass(catWrapEl, 'is-tailflick', 700); markBusy(700); }
      return;
    }
    var act = pickIdle();
    pulseClass(catWrapEl, act.cls, act.ms);
    markBusy(act.ms);
    if (act.cls === 'is-yawn') fxZzzOnce();
  }

  // ---------- амбиент: живой мир ----------
  function startAmbient() {
    stopAmbient();
    // мягкий тик: zzz во сне + редкий мяв компаньона
    ambientTimer = setInterval(function () {
      if (!mounted || document.hidden) return;
      var mood = catEl.getAttribute('data-mood');
      if (mood === 'sleepy') fxZzzOnce();
      maybeCompanionMew();
    }, 2600);

    if (!reduceMotion) {
      scheduleIdle();       // idle-микродействия главного котёнка
      scheduleGuest();
      scheduleWeather();
    }
  }
  function stopAmbient() {
    if (ambientTimer) { clearInterval(ambientTimer); ambientTimer = null; }
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    if (guestTimer) { clearTimeout(guestTimer); guestTimer = null; }
    if (weatherTimer) { clearTimeout(weatherTimer); weatherTimer = null; }
    if (lookTimer) { clearTimeout(lookTimer); lookTimer = null; }
  }

  var DAY_GUESTS = ['🦋', '🐦', '🐝', '🐛'];
  var NIGHT_GUESTS = ['🦇', '🦉', '⭐'];
  function scheduleGuest() {
    var delay = 9000 + Math.random() * 14000;
    guestTimer = setTimeout(function () {
      spawnGuest();
      scheduleGuest();
    }, delay);
  }
  function spawnGuest() {
    if (!mounted || document.hidden || !guestsEl) return;
    var pool = lastNight ? NIGHT_GUESTS : DAY_GUESTS;
    var emoji = pool[Math.floor(Math.random() * pool.length)];
    var g = ce('span', 'cv-guest');
    var lr = Math.random() > 0.5;
    g.classList.add(lr ? 'dir-lr' : 'dir-rl');
    g.textContent = emoji;
    g.style.top = (10 + Math.random() * 38) + '%';
    g.style.fontSize = (18 + Math.random() * 12) + 'px';
    var dur = 8 + Math.random() * 6;
    g.style.setProperty('--gd', dur.toFixed(1) + 's');
    guestsEl.appendChild(g);
    // котёнок провожает гостя взглядом (в сторону его движения)
    setLook(lr ? 'r' : 'l');
    var done = function () { if (g.parentNode) g.parentNode.removeChild(g); };
    g.addEventListener('animationend', done);
    setTimeout(done, dur * 1000 + 600);
  }

  function scheduleWeather() {
    var delay = 2200 + Math.random() * 2600;
    weatherTimer = setTimeout(function () {
      spawnDrop();
      scheduleWeather();
    }, delay);
  }
  function spawnDrop() {
    if (!mounted || document.hidden || !weatherEl) return;
    var pool = lastNight ? ['❄️', '✨', '·'] : ['🍃', '🌸', '·'];
    var e = pool[Math.floor(Math.random() * pool.length)];
    var d = ce('span', 'cv-drop');
    d.textContent = e;
    d.style.left = (Math.random() * 100) + '%';
    d.style.fontSize = (12 + Math.random() * 10) + 'px';
    var dur = 5 + Math.random() * 4;
    d.style.setProperty('--wd', dur.toFixed(1) + 's');
    d.style.setProperty('--wx', (Math.random() * 60 - 30).toFixed(0) + 'px');
    d.style.setProperty('--wr', (Math.random() * 220 - 110).toFixed(0) + 'deg');
    weatherEl.appendChild(d);
    var done = function () { if (d.parentNode) d.parentNode.removeChild(d); };
    d.addEventListener('animationend', done);
    setTimeout(done, dur * 1000 + 700);
  }

  function subscribe() {
    if (subscribed || !window.CatGame || !CatGame.on) return;
    subscribed = true;
    // v1
    CatGame.on('ready', render);
    CatGame.on('tick', render);
    CatGame.on('stats:change', render);
    CatGame.on('poop:spawn', render);
    CatGame.on('poop:clean', render);
    CatGame.on('item:equip', render);
    CatGame.on('action:pet', onActionPet);
    CatGame.on('action:feed', onActionFeed);
    CatGame.on('action:wash', onActionWash);
    CatGame.on('action:play', onActionPlay);
    CatGame.on('action:sleep', onActionSleep);
    // v2
    CatGame.on('action:heal', onActionHeal);
    CatGame.on('health:change', render);
    CatGame.on('stage:change', onStageChange);
    CatGame.on('level:up', onLevelUp);
    CatGame.on('daynight:change', onDayNight);
    CatGame.on('name:change', onName);
    // v2.1 — компаньоны
    CatGame.on('companion:adopt', onCompanionAdopt);
  }

  // ---------- публичный API ----------
  window.CatView = {
    mount: function (el) {
      if (!el) return;
      stopAmbient();
      Object.keys(timers).forEach(function (k) { clearTimeout(timers[k]); });
      timers = {};
      poopNodes = {};        // старые узлы принадлежат прошлому DOM-дереву — не переиспользуем
      companionNodes = {};   // то же для компаньонов
      lastBgId = undefined;
      lastDecorId = undefined;
      lastStage = undefined;
      lastSick = undefined;
      lastNight = undefined;
      busyUntil = 0;
      stageEl = el;
      buildDom(stageEl);
      mounted = true;
      subscribe();
      // стартовое освещение до первого события daynight:change
      applyDayNight(window.CatGame && CatGame.isNight ? CatGame.isNight() : false, true);
      startAmbient();
      render();
    },
    render: render
  };
})();

</script>

<script>
/* ===== js/shop.js ===== */
/* js/shop.js */
/* js/shop.js — window.Shop (владелец: pam).
   По CONTRACT.md §3/§9/§10/§12. Вкладки: Магазин / Гардероб / Коллекция / Достижения.
   Читает CatGame ТОЛЬКО через API §3: CatGame.wallet, CatGame.wardrobe, CatGame.meta,
   CatGame.on/off. Данные — window.CatItems, window.CatMeta. Свой namespace — .shop-.
   Не рисует котёнка и не лезет в чужой DOM. Стили — в css/shop.css. */
(function () {
  'use strict';

  // ---------- Константы UI ----------
  var SLOT_ORDER = ['hat', 'collar', 'outfit', 'bg', 'toy', 'decor'];
  var SLOT_LABEL = {
    hat: 'Шляпы', collar: 'Ошейники', outfit: 'Наряды',
    bg: 'Фоны', toy: 'Игрушки', decor: 'Мебель'
  };
  var RARITY_LABEL = { common: 'Обычный', rare: 'Редкий', epic: 'Эпический', legendary: 'Легендарный' };
  var TABS = [
    { id: 'market',       label: 'Магазин',     emoji: '🛍️' },
    { id: 'wardrobe',     label: 'Гардероб',    emoji: '👔' },
    { id: 'companions',   label: 'Котята',      emoji: '🐾' },
    { id: 'collection',   label: 'Коллекция',   emoji: '📖' },
    { id: 'achievements', label: 'Достижения',  emoji: '🏆' }
  ];

  // ---------- Локальное состояние модуля ----------
  var panel = null;
  var mounted = false;
  var activeTab = 'market';

  // ---------- Утилиты ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function items() { return window.CatItems || []; }

  function itemsBySlot() {
    var map = {};
    SLOT_ORDER.forEach(function (s) { map[s] = []; });
    items().forEach(function (it) {
      if (!map[it.slot]) map[it.slot] = [];
      map[it.slot].push(it);
    });
    return map;
  }

  // ---------- Безопасные обёртки над CatGame API (§3) ----------
  function game() { return window.CatGame || null; }
  function gameState() { var g = game(); return (g && g.state) || {}; }

  function balance() {
    var g = game();
    try { if (g && g.wallet && g.wallet.balance) return g.wallet.balance() | 0; } catch (e) {}
    return (gameState().mircoins) | 0;
  }
  function owns(id) {
    var g = game();
    try { if (g && g.wardrobe && g.wardrobe.own) return !!g.wardrobe.own(id); } catch (e) {}
    var inv = gameState().inventory || [];
    return inv.indexOf(id) !== -1;
  }
  function equippedItem(slot) {
    var g = game();
    try { if (g && g.wardrobe && g.wardrobe.equippedItem) return g.wardrobe.equippedItem(slot); } catch (e) {}
    var eq = gameState().equipped || {};
    return eq[slot] || null;
  }
  function doBuy(id) {
    var g = game();
    try { if (g && g.wardrobe && g.wardrobe.buy) g.wardrobe.buy(id); }
    catch (err) { console.warn('[shop] buy failed', err); }
  }
  function doEquip(slot, id) {
    var g = game();
    try { if (g && g.wardrobe && g.wardrobe.equip) g.wardrobe.equip(slot, id); }
    catch (err) { console.warn('[shop] equip failed', err); }
  }
  function doUnequip(slot) {
    var g = game();
    try { if (g && g.wardrobe && g.wardrobe.unequip) g.wardrobe.unequip(slot); }
    catch (err) { console.warn('[shop] unequip failed', err); }
  }

  // ---------- Безопасные обёртки над CatGame.companions (§15) ----------
  // Ядро — источник правды. Если API недоступен — мягкий fallback на state/данные.
  function companionsApi() { var g = game(); return (g && g.companions) || null; }

  // Каталог компаньонов: сперва из ядра, иначе — из window.CatCompanions
  function companionCatalog() {
    var api = companionsApi();
    if (api && api.all) {
      try {
        var all = api.all();
        if (all && all.length) return all;
      } catch (e) {}
    }
    return window.CatCompanions || [];
  }
  // id заведённых компаньонов
  function ownedCompanionIds() {
    var api = companionsApi();
    if (api && api.list) {
      try {
        var l = api.list();
        if (l) return l;
      } catch (e) {}
    }
    return (gameState().companions) || [];
  }
  function ownsCompanion(id) {
    var api = companionsApi();
    if (api && api.own) {
      try { return !!api.own(id); } catch (e) {}
    }
    return ownedCompanionIds().indexOf(id) !== -1;
  }
  // Максимум компаньонов (кап). По контракту — 6.
  function companionCap() {
    var api = companionsApi();
    if (api && api.cap) {
      try { var c = api.cap() | 0; if (c > 0) return c; } catch (e) {}
    }
    return 6;
  }
  function doAdopt(id) {
    var api = companionsApi();
    try { if (api && api.adopt) api.adopt(id); }
    catch (err) { console.warn('[shop] adopt failed', err); }
  }

  // metric -> текущее значение (для fallback-прогресса, если ядро не отдаёт meta)
  function metricValue(metric) {
    var st = gameState();
    if (metric === 'level') return st.level | 0;
    if (metric === 'companions') return ownedCompanionIds().length | 0;
    var counters = st.counters || {};
    return counters[metric] | 0;
  }

  // Ачивки: [{id, def, unlocked, progress}] — из ядра либо fallback по counters
  function getAchievements() {
    var g = game();
    if (g && g.meta && g.meta.achievements) {
      try {
        var list = g.meta.achievements();
        if (list && list.length) return list;
      } catch (e) {}
    }
    var defs = (window.CatMeta && window.CatMeta.achievements) || [];
    return defs.map(function (def) {
      var cur = metricValue(def.metric);
      return { id: def.id, def: def, unlocked: cur >= def.target, progress: Math.min(cur, def.target) };
    });
  }

  // Дневные квесты: [{id, progress, target, done, claimed}] — только из ядра (иначе пусто)
  function getDailyQuests() {
    var g = game();
    if (g && g.meta && g.meta.dailyQuests) {
      try {
        var list = g.meta.dailyQuests();
        if (list) return list;
      } catch (e) {}
    }
    // fallback: если ядро уже сложило daily в state
    var q = gameState().quests;
    return (q && q.daily) || [];
  }
  function claimQuest(id) {
    var g = game();
    try { if (g && g.meta && g.meta.claimQuest) g.meta.claimQuest(id); }
    catch (err) { console.warn('[shop] claimQuest failed', err); }
  }

  // Шаблон дневного квеста из пула по id (для имени/эмодзи/награды)
  var _dqTplCache = null;
  function dqTemplate(id) {
    if (!_dqTplCache) {
      _dqTplCache = {};
      var pool = (window.CatMeta && window.CatMeta.dailyPool) || [];
      pool.forEach(function (t) { _dqTplCache[t.id] = t; });
    }
    // id квеста в state может нести суффикс инстанса — пробуем точное и по префиксу
    if (_dqTplCache[id]) return _dqTplCache[id];
    for (var key in _dqTplCache) {
      if (_dqTplCache.hasOwnProperty(key) && id && id.indexOf(key) === 0) return _dqTplCache[key];
    }
    return null;
  }

  // ---------- Рендер: вкладка «Магазин» ----------
  function renderMarket() {
    var grouped = itemsBySlot();
    var bal = balance();
    var html = '';
    SLOT_ORDER.forEach(function (slot) {
      var list = grouped[slot] || [];
      if (!list.length) return;
      html += '<section class="shop-group"><h4 class="shop-group-title">' + esc(SLOT_LABEL[slot]) + '</h4><div class="shop-grid">';
      list.forEach(function (it) {
        var owned = owns(it.id);
        var afford = bal >= it.price;
        var rarity = it.rarity || 'common';
        var btnCls, btnTxt, dis = '';
        if (owned) { btnCls = 'shop-btn owned'; btnTxt = 'Куплено'; dis = ' disabled'; }
        else if (!afford) { btnCls = 'shop-btn'; btnTxt = '🪙 ' + it.price; dis = ' disabled'; }
        else { btnCls = 'shop-btn buy'; btnTxt = '🪙 ' + it.price; }
        html +=
          '<article class="shop-card r-' + rarity + (owned ? ' is-owned' : '') + '">' +
            '<div class="shop-card-emoji">' + esc(it.emoji) + '</div>' +
            '<div class="shop-card-name">' + esc(it.name) + '</div>' +
            '<div class="shop-card-rarity r-' + rarity + '">' + esc(RARITY_LABEL[rarity] || rarity) + '</div>' +
            '<button class="' + btnCls + '" data-action="buy" data-id="' + esc(it.id) + '"' + dis + '>' + btnTxt + '</button>' +
          '</article>';
      });
      html += '</div></section>';
    });
    return html || '<p class="shop-empty">Каталог пуст.</p>';
  }

  // ---------- Рендер: вкладка «Гардероб» ----------
  function renderWardrobe() {
    var grouped = itemsBySlot();
    var html = '';
    var any = false;
    SLOT_ORDER.forEach(function (slot) {
      var owned = (grouped[slot] || []).filter(function (it) { return owns(it.id); });
      if (!owned.length) return;
      any = true;
      var eq = equippedItem(slot);
      html += '<section class="shop-group"><h4 class="shop-group-title">' + esc(SLOT_LABEL[slot]) + '</h4><div class="shop-grid">';
      owned.forEach(function (it) {
        var isEq = eq === it.id;
        var rarity = it.rarity || 'common';
        html +=
          '<article class="shop-card r-' + rarity + (isEq ? ' is-equipped' : '') + '">' +
            '<div class="shop-card-emoji">' + esc(it.emoji) + '</div>' +
            '<div class="shop-card-name">' + esc(it.name) + '</div>' +
            '<div class="shop-card-rarity r-' + rarity + '">' + (isEq ? 'Надето' : esc(RARITY_LABEL[rarity] || rarity)) + '</div>' +
            '<button class="shop-btn ' + (isEq ? 'unequip' : 'equip') + '" data-action="' + (isEq ? 'unequip' : 'equip') +
              '" data-id="' + esc(it.id) + '" data-slot="' + esc(slot) + '">' + (isEq ? 'Снять' : 'Надеть') + '</button>' +
          '</article>';
      });
      html += '</div></section>';
    });
    return any ? html : '<p class="shop-empty">Гардероб пуст — загляните в магазин! 🛍️</p>';
  }

  // ---------- Рендер: вкладка «Котята» (адопт компаньонов) ----------
  function renderCompanions() {
    var catalog = companionCatalog();
    if (!catalog.length) return '<p class="shop-empty">Котята скоро приедут в приют 🐾</p>';

    var bal = balance();
    var ownedCount = ownedCompanionIds().length;
    var cap = companionCap();
    var full = ownedCount >= cap;

    // Шапка: счётчик заведённых котят и статус капа
    var html =
      '<div class="shop-collect-head">' +
        '<div class="shop-collect-sum">Котята дома <b>' + ownedCount + '</b> / ' + cap + '</div>' +
        (full
          ? '<div class="shop-comp-note is-full">Достаточно котят (' + ownedCount + '/' + cap + ') 🏠</div>'
          : '<div class="shop-comp-note">Заведи друзей для своего котика!</div>') +
      '</div>';

    html += '<div class="shop-grid">';
    catalog.forEach(function (c) {
      var owned = ownsCompanion(c.id);
      var afford = bal >= c.price;
      var rarity = c.rarity || 'common';
      var fur = c.fur || '#cccccc';
      var accent = c.accent || '#888888';

      // Превью — кружок цвета шерсти с обводкой акцента (+ маленькие ушки-акценты)
      var preview =
        '<div class="shop-comp-preview" style="background:' + esc(fur) +
          ';border-color:' + esc(accent) + '">' +
          '<span class="shop-comp-ear l" style="background:' + esc(accent) + '"></span>' +
          '<span class="shop-comp-ear r" style="background:' + esc(accent) + '"></span>' +
          '<span class="shop-comp-emoji">' + esc(c.emoji || '🐱') + '</span>' +
        '</div>';

      // Кнопка: Заведён / Достаточно котят / нехватка баланса / Завести
      var btnCls, btnTxt, dis = '';
      if (owned) { btnCls = 'shop-btn owned'; btnTxt = 'Заведён ✓'; dis = ' disabled'; }
      else if (full) { btnCls = 'shop-btn'; btnTxt = 'Мест нет'; dis = ' disabled'; }
      else if (!afford) { btnCls = 'shop-btn'; btnTxt = '🪙 ' + c.price; dis = ' disabled'; }
      else { btnCls = 'shop-btn adopt'; btnTxt = 'Завести 🪙 ' + c.price; }

      html +=
        '<article class="shop-card shop-comp-card r-' + rarity + (owned ? ' is-owned' : '') + '">' +
          preview +
          '<div class="shop-card-name">' + esc(c.name) + '</div>' +
          '<div class="shop-card-rarity r-' + rarity + '">' + esc(RARITY_LABEL[rarity] || rarity) + '</div>' +
          '<button class="' + btnCls + '" data-action="adopt" data-id="' + esc(c.id) + '"' + dis + '>' + btnTxt + '</button>' +
        '</article>';
    });
    html += '</div>';
    return html;
  }

  // ---------- Рендер: вкладка «Коллекция» (альбом) ----------
  function renderCollection() {
    var grouped = itemsBySlot();
    var totalOwned = 0, totalAll = 0;
    items().forEach(function (it) { totalAll++; if (owns(it.id)) totalOwned++; });

    var pct = totalAll ? Math.round(totalOwned / totalAll * 100) : 0;
    var html =
      '<div class="shop-collect-head">' +
        '<div class="shop-collect-sum">Собрано <b>' + totalOwned + '</b> / ' + totalAll + '</div>' +
        '<div class="shop-bar"><span class="shop-bar-fill" style="width:' + pct + '%"></span></div>' +
      '</div>';

    SLOT_ORDER.forEach(function (slot) {
      var list = grouped[slot] || [];
      if (!list.length) return;
      var own = list.filter(function (it) { return owns(it.id); }).length;
      html += '<section class="shop-group">' +
        '<h4 class="shop-group-title">' + esc(SLOT_LABEL[slot]) +
        ' <span class="shop-group-count">' + own + '/' + list.length + '</span></h4>' +
        '<div class="shop-album">';
      list.forEach(function (it) {
        var have = owns(it.id);
        var rarity = it.rarity || 'common';
        html +=
          '<div class="shop-cell r-' + rarity + (have ? ' is-owned' : ' is-locked') + '" title="' + esc(it.name) + '">' +
            '<div class="shop-cell-emoji">' + (have ? esc(it.emoji) : '❔') + '</div>' +
            '<div class="shop-cell-name">' + (have ? esc(it.name) : '???') + '</div>' +
          '</div>';
      });
      html += '</div></section>';
    });
    return html;
  }

  // ---------- Рендер: вкладка «Достижения» ----------
  function renderAchievements() {
    var achs = getAchievements();
    var quests = getDailyQuests();
    var html = '';

    // --- Дневные квесты ---
    html += '<section class="shop-group"><h4 class="shop-group-title">🎯 Дневные квесты</h4>';
    if (quests && quests.length) {
      html += '<div class="shop-quests">';
      quests.forEach(function (q) {
        var tpl = dqTemplate(q.id) || {};
        var target = q.target != null ? q.target : (tpl.target || 0);
        var prog = Math.min(q.progress | 0, target);
        var pct = target ? Math.round(prog / target * 100) : 0;
        var reward = q.reward != null ? q.reward : (tpl.reward || 0);
        var done = !!q.done || (target && prog >= target);
        var claimed = !!q.claimed;
        var name = tpl.name || q.name || 'Квест';
        var emoji = tpl.emoji || q.emoji || '🎯';
        var btn;
        if (claimed) btn = '<button class="shop-btn owned" disabled>Получено ✓</button>';
        else if (done) btn = '<button class="shop-btn claim" data-action="claim" data-id="' + esc(q.id) + '">Забрать 🪙 ' + reward + '</button>';
        else btn = '<span class="shop-quest-reward">🪙 ' + reward + '</span>';
        html +=
          '<div class="shop-quest' + (done ? ' is-done' : '') + (claimed ? ' is-claimed' : '') + '">' +
            '<div class="shop-quest-emoji">' + esc(emoji) + '</div>' +
            '<div class="shop-quest-info">' +
              '<div class="shop-quest-name">' + esc(name) + '</div>' +
              '<div class="shop-bar sm"><span class="shop-bar-fill" style="width:' + pct + '%"></span></div>' +
              '<div class="shop-quest-prog">' + prog + ' / ' + target + '</div>' +
            '</div>' +
            '<div class="shop-quest-act">' + btn + '</div>' +
          '</div>';
      });
      html += '</div>';
    } else {
      html += '<p class="shop-empty">Квесты появятся совсем скоро 🐾</p>';
    }
    html += '</section>';

    // --- Ачивки ---
    var unlockedCount = achs.filter(function (a) { return a.unlocked; }).length;
    html += '<section class="shop-group"><h4 class="shop-group-title">🏆 Достижения ' +
      '<span class="shop-group-count">' + unlockedCount + '/' + achs.length + '</span></h4>';
    if (achs.length) {
      html += '<div class="shop-achs">';
      achs.forEach(function (a) {
        var def = a.def || {};
        var target = def.target || 0;
        var prog = Math.min(a.progress | 0, target);
        var pct = target ? Math.round(prog / target * 100) : 0;
        html +=
          '<div class="shop-ach' + (a.unlocked ? ' is-unlocked' : '') + '">' +
            '<div class="shop-ach-emoji">' + esc(def.emoji || '🏅') + '</div>' +
            '<div class="shop-ach-info">' +
              '<div class="shop-ach-name">' + esc(def.name || a.id) + (a.unlocked ? ' ✓' : '') + '</div>' +
              '<div class="shop-ach-desc">' + esc(def.desc || '') + '</div>' +
              (a.unlocked ? '' :
                '<div class="shop-bar sm"><span class="shop-bar-fill" style="width:' + pct + '%"></span></div>' +
                '<div class="shop-ach-prog">' + prog + ' / ' + target + '</div>') +
            '</div>' +
          '</div>';
      });
      html += '</div>';
    } else {
      html += '<p class="shop-empty">Список достижений пуст.</p>';
    }
    html += '</section>';

    return html;
  }

  // ---------- Каркас и рендер ----------
  function renderHead() {
    if (!panel) return;
    var balEl = panel.querySelector('.shop-balance-num');
    if (balEl) balEl.textContent = String(balance());
    var tabs = panel.querySelectorAll('.shop-tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('is-active', tabs[i].getAttribute('data-tab') === activeTab);
    }
  }

  function renderBody() {
    if (!panel) return;
    var body = panel.querySelector('.shop-body');
    if (!body) return;
    var html;
    switch (activeTab) {
      case 'wardrobe':     html = renderWardrobe(); break;
      case 'companions':   html = renderCompanions(); break;
      case 'collection':   html = renderCollection(); break;
      case 'achievements': html = renderAchievements(); break;
      default:             html = renderMarket();
    }
    body.innerHTML = html;
  }

  function renderAll() {
    if (!panel) return;
    renderHead();
    renderBody();
  }

  function buildSkeleton() {
    var tabsHtml = TABS.map(function (t) {
      return '<button class="shop-tab" data-tab="' + t.id + '"><span class="shop-tab-emoji">' +
        t.emoji + '</span><span class="shop-tab-label">' + esc(t.label) + '</span></button>';
    }).join('');
    panel.innerHTML =
      '<div class="shop-root">' +
        '<div class="shop-head">' +
          '<div class="shop-tabs">' + tabsHtml + '</div>' +
          '<div class="shop-balance">🪙 <span class="shop-balance-num">0</span></div>' +
        '</div>' +
        '<div class="shop-body"></div>' +
      '</div>';
  }

  // ---------- Обработка кликов (делегирование) ----------
  function onPanelClick(e) {
    var tabBtn = e.target.closest && e.target.closest('.shop-tab');
    if (tabBtn) {
      var t = tabBtn.getAttribute('data-tab');
      if (t && t !== activeTab) { activeTab = t; renderAll(); }
      return;
    }
    var act = e.target.closest && e.target.closest('[data-action]');
    if (!act || act.disabled) return;
    var action = act.getAttribute('data-action');
    var id = act.getAttribute('data-id');
    var slot = act.getAttribute('data-slot');

    if (action === 'buy') { doBuy(id); renderAll(); }
    else if (action === 'equip') { doEquip(slot, id); renderAll(); }
    else if (action === 'unequip') { doUnequip(slot); renderAll(); }
    else if (action === 'adopt') { doAdopt(id); renderAll(); }
    else if (action === 'claim') { claimQuest(id); renderAll(); }
  }

  // ---------- Подписка на события ядра (§5) ----------
  function subscribe() {
    var g = game();
    if (!g || !g.on) return;
    // баланс/покупки/экипировка
    g.on('wallet:change', renderAll);
    g.on('item:buy', renderAll);
    g.on('item:equip', renderAll);
    // прогрессия/мета
    g.on('level:up', renderAll);
    g.on('achievement:unlock', renderAll);
    g.on('quest:progress', renderAll);
    g.on('quest:done', renderAll);
    g.on('quest:claim', renderAll);
    // компаньоны (§15): обновляем вкладку «Котята» и баланс
    g.on('companion:adopt', renderAll);
    g.on('stats:change', renderAll);
  }

  // ---------- Публичный API ----------
  window.Shop = {
    // Рисует магазин внутри переданного контейнера (§12: #screen-shop)
    mount: function (containerEl, opts) {
      panel = containerEl;
      if (!panel) return;
      if (opts && opts.tab) activeTab = opts.tab;
      if (mounted) { renderAll(); return; }
      mounted = true;
      buildSkeleton();
      panel.addEventListener('click', onPanelClick);
      subscribe();
      renderAll();
    },
    // Программное переключение вкладки (market|wardrobe|collection|achievements)
    setTab: function (tab) {
      if (!tab) return;
      activeTab = tab;
      renderAll();
    },
    // Принудительная перерисовка (например, при возврате на экран)
    refresh: function () { renderAll(); }
  };
})();

</script>

<script>
/* ===== js/translator.js ===== */
/* js/translator.js */
/* js/translator.js — window.MeowTranslator (владелец: god).
   Экран «Мяу-переводчик»: слушает реального котика через микрофон (WebAudio
   AnalyserNode: громкость/доминирующая частота/длительность/интонация) и выдаёт
   ВЕСЁЛЫЙ «перевод». Если микрофон недоступен/запрещён (песочница артефакта) —
   graceful fallback в тап-режим («демо»). Перевод — развлечение, не наука.
   Читает CatGame.state для лёгкого биаса под текущие нужды котёнка. Namespace .mt-. */
(function () {
  'use strict';

  function ce(tag, cls) { var el = document.createElement(tag); if (cls) el.className = cls; return el; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
  function num(v, f) { return (typeof v === 'number' && !isNaN(v)) ? v : f; }

  // Категории «переводов» с несколькими фразами (для разнообразия).
  var CATS = {
    hungry:    { emoji: '🍗', tone: 'требовательное «мяу»', phrases: ['Хочу есть! Насыпь вкусняшек, человек!', 'Миска пустая — это возмутительно!', 'Корми меня немедленно! 🐟', 'Я умираю с голоду (нет, но покорми).'] },
    attention: { emoji: '👀', tone: 'короткое звонкое «мяу»', phrases: ['Эй! Посмотри на меня!', 'Я тут, обрати внимание!', 'Поговори со мной, ну!', 'Ты меня игнорируешь? Недопустимо.'] },
    affection: { emoji: '💗', tone: 'мягкое нежное «мрр-мяу»', phrases: ['Погладь меня, пожалуйста…', 'Хочу на ручки и мурчать 🥰', 'Ты — мой человек ❤️', 'Почеши за ушком, будь добр.'] },
    play:      { emoji: '🧶', tone: 'игривое «мяу-мяу»', phrases: ['Пойдём играть! Где дразнилка?', 'Гоняем клубок? 🧶', 'Мне скучно — развлеки меня!', 'Атакую твои носки через 3… 2… 1…'] },
    door:      { emoji: '🚪', tone: 'настойчивое «мяу» с повышением', phrases: ['Выпусти меня! Открой дверь!', 'Хочу гулять на волю 🌿', 'Пусти в ту комнату, там интереснее.', 'Дверь. Открой. Сейчас.'] },
    annoyed:   { emoji: '😾', tone: 'низкое ворчливое «мя-а-у»', phrases: ['Я недоволен. Прекрати это.', 'Не трогай меня сейчас, человек.', 'Ты опоздал с ужином. Я запомнил.', 'Оставь меня в покое… пока.'] },
    happy:     { emoji: '😻', tone: 'довольное «мрр-мяу»', phrases: ['Мне хорошо и уютно 😌', 'Спасибо, я всем доволен!', 'Мурр… жизнь прекрасна.', 'Ты лучший хозяин, так и знай.'] },
    sleepy:    { emoji: '😴', tone: 'тихое сонное «мяу»', phrases: ['Хочу спать, не мешай…', 'Устал, оставь на подушке 💤', 'Зевок… баю-бай.', 'Пять минуточек ещё…'] }
  };

  var containerEl = null, mounted = false;
  var stream = null, ac = null, analyser = null, srcNode = null, rafId = null, recTimer = null;
  var listening = false, micBlocked = false;
  var elBtn, elDemo, elMeter, elMeterFill, elResult, elStatus, elHint;

  // ---------- построение UI ----------
  function build() {
    containerEl.innerHTML = '';
    var wrap = ce('div', 'mt-wrap');

    var head = ce('div', 'mt-head');
    var h = ce('h2', 'mt-title'); h.textContent = '🎙️ Мяу-переводчик';
    var sub = ce('p', 'mt-sub'); sub.textContent = 'Поднеси телефон к котику и нажми «Послушать». Переводчик расшифрует, что он говорит. (Для веселья 😺)';
    head.appendChild(h); head.appendChild(sub);

    var mic = ce('div', 'mt-mic');
    var orb = ce('div', 'mt-orb'); orb.innerHTML = '<span class="mt-orb-ico">🐱</span>';
    elMeter = ce('div', 'mt-meter'); elMeterFill = ce('i'); elMeter.appendChild(elMeterFill);
    mic.appendChild(orb); mic.appendChild(elMeter);

    elStatus = ce('div', 'mt-status'); elStatus.textContent = '';

    elBtn = ce('button', 'mt-btn'); elBtn.type = 'button'; elBtn.textContent = '🎙️ Послушать котика';
    elBtn.addEventListener('click', onListen);

    elDemo = ce('button', 'mt-btn mt-btn-ghost'); elDemo.type = 'button'; elDemo.textContent = '🐾 Декодировать без микрофона';
    elDemo.addEventListener('click', function () { decodeFromFeatures(fakeFeatures(), true); });

    elResult = ce('div', 'mt-result'); elResult.hidden = true;

    elHint = ce('p', 'mt-note'); elHint.textContent = '';

    wrap.appendChild(head);
    wrap.appendChild(mic);
    wrap.appendChild(elStatus);
    wrap.appendChild(elBtn);
    wrap.appendChild(elDemo);
    wrap.appendChild(elResult);
    wrap.appendChild(elHint);
    containerEl.appendChild(wrap);
    orbEl = orb;
  }
  var orbEl = null;

  // ---------- захват микрофона ----------
  function onListen() {
    if (listening) { return; }
    if (micBlocked) { decodeFromFeatures(fakeFeatures(), true); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micUnavailable(); return; }
    setStatus('Запрашиваю доступ к микрофону…');
    if (window.CatAudio && CatAudio.resume) CatAudio.resume();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(startAnalyse).catch(function () { micUnavailable(); });
  }

  function startAnalyse(s) {
    stream = s;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      srcNode = ac.createMediaStreamSource(s);
      analyser = ac.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.6;
      srcNode.connect(analyser);
    } catch (e) { micUnavailable(); return; }

    listening = true;
    elBtn.disabled = true; elBtn.textContent = '👂 Слушаю…';
    if (orbEl) orbEl.classList.add('is-live');
    elResult.hidden = true;
    setStatus('Слушаю котика… мяукни! 🐱');

    var freq = new Uint8Array(analyser.frequencyBinCount);
    var samples = [];
    var start = (window.performance && performance.now) ? performance.now() : 0;
    function now() { return (window.performance && performance.now) ? performance.now() : (start + samples.length * 30); }

    function tick() {
      analyser.getByteFrequencyData(freq);
      var maxV = 0, maxI = 0, sum = 0;
      for (var i = 1; i < freq.length; i++) { sum += freq[i]; if (freq[i] > maxV) { maxV = freq[i]; maxI = i; } }
      var domFreq = maxI * ac.sampleRate / analyser.fftSize;
      var loud = sum / freq.length; // 0..~128
      samples.push({ t: now() - start, dom: domFreq, loud: loud, peak: maxV });
      updateMeter(Math.min(1, loud / 60));
      if (now() - start < 3400) { rafId = requestAnimationFrame(tick); }
      else finishAnalyse(samples);
    }
    rafId = requestAnimationFrame(tick);
  }

  function finishAnalyse(samples) {
    cleanupAudio();
    listening = false;
    elBtn.disabled = false; elBtn.textContent = '🎙️ Послушать ещё раз';
    if (orbEl) orbEl.classList.remove('is-live');
    updateMeter(0);

    // активные сэмплы (где реально был звук)
    var active = samples.filter(function (s) { return s.loud > 14; });
    if (active.length < 3) {
      setStatus('Хм, я ничего не расслышал — мяукни погромче и ближе 🐱');
      return;
    }
    var avgLoud = avg(active.map(function (s) { return s.loud; }));
    var peakLoud = Math.max.apply(null, active.map(function (s) { return s.loud; }));
    var avgDom = avg(active.map(function (s) { return s.dom; }));
    var durMs = active[active.length - 1].t - active[0].t;
    var half = Math.floor(active.length / 2);
    var domFirst = avg(active.slice(0, half).map(function (s) { return s.dom; }));
    var domLast = avg(active.slice(half).map(function (s) { return s.dom; }));
    var trend = domLast - domFirst; // >0 повышение (вопрос/дверь)
    // вариативность тона -> игривость
    var variance = 0; for (var i = 0; i < active.length; i++) variance += Math.abs(active[i].dom - avgDom);
    variance = variance / active.length;

    setStatus('');
    decodeFromFeatures({ avgLoud: avgLoud, peakLoud: peakLoud, avgDom: avgDom, durMs: durMs, trend: trend, variance: variance, real: true }, false);
  }

  function updateMeter(v) { if (elMeterFill) elMeterFill.style.width = Math.round(Math.max(0, Math.min(1, v)) * 100) + '%'; }
  function avg(a) { if (!a.length) return 0; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
  function setStatus(t) { if (elStatus) elStatus.textContent = t; }

  function micUnavailable() {
    micBlocked = true;
    cleanupAudio(); listening = false;
    elBtn.disabled = false; elBtn.textContent = '🐾 Декодировать (демо)';
    if (orbEl) orbEl.classList.remove('is-live');
    setStatus('Микрофон недоступен в этой среде — включаю демо-режим 🐾');
    if (elHint) elHint.textContent = 'В песочнице доступ к микрофону может быть закрыт. Демо-режим переводит «в шутку», без записи.';
    elDemo.hidden = true; // основная кнопка теперь и есть демо
  }

  function cleanupAudio() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
    try { if (srcNode) srcNode.disconnect(); } catch (e) {}
    try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (ac && ac.close) ac.close(); } catch (e) {}
    stream = null; ac = null; analyser = null; srcNode = null;
  }

  // ---------- фичи -> категория -> перевод ----------
  function fakeFeatures() {
    // псевдо-признаки для демо/фолбэка
    return {
      avgLoud: 20 + Math.random() * 40,
      peakLoud: 60 + Math.random() * 60,
      avgDom: 300 + Math.random() * 900,
      durMs: 400 + Math.random() * 1600,
      trend: (Math.random() - 0.5) * 600,
      variance: Math.random() * 300,
      real: false
    };
  }

  // Лёгкий биас по текущим нуждам игрового котёнка.
  function stateBias() {
    var st = (window.CatGame && CatGame.state) ? CatGame.state : null;
    if (!st) return null;
    if (st.energy < 25) return 'sleepy';
    if (st.hunger < 35) return 'hungry';
    if (st.happiness < 35) return 'affection';
    if (st.hygiene < 30) return 'annoyed';
    if (st.happiness > 80 && st.hunger > 60) return 'happy';
    return null;
  }

  function classify(f) {
    // приоритетные правила по «фичам»
    if (f.peakLoud > 95 && f.durMs > 900) return f.trend > 120 ? 'door' : 'hungry';
    if (f.avgDom < 380 && f.avgLoud > 22) return 'annoyed';
    if (f.avgLoud < 22 && f.avgDom > 500) return f.durMs < 700 ? 'affection' : 'sleepy';
    if (f.variance > 220) return 'play';
    if (f.avgDom > 760 && f.durMs < 700) return 'attention';
    if (f.trend > 160) return 'door';
    return 'happy';
  }

  function decodeFromFeatures(f, isDemo) {
    // «анализ…» с задержкой ради драмы
    elResult.hidden = true;
    setStatus(isDemo ? 'Декодирую…' : 'Расшифровываю мяу…');
    if (orbEl) orbEl.classList.add('is-think');
    if (recTimer) clearTimeout(recTimer);
    recTimer = setTimeout(function () {
      if (orbEl) orbEl.classList.remove('is-think');
      var cat = classify(f);
      // биас: с шансом 45% уступаем текущей нужде котёнка (если есть)
      var bias = stateBias();
      if (bias && Math.random() < 0.45) cat = bias;
      var def = CATS[cat] || CATS.happy;
      var phrase = rnd(def.phrases);
      var conf = 72 + Math.floor(Math.random() * 27); // 72..98%
      renderResult(def, phrase, conf, f, isDemo);
      setStatus('');
      if (window.CatAudio) CatAudio.play(cat === 'annoyed' ? 'error' : (cat === 'happy' || cat === 'affection' ? 'purr' : 'meow'));
    }, isDemo ? 700 : 500);
  }

  function renderResult(def, phrase, conf, f, isDemo) {
    elResult.innerHTML = '';
    var card = ce('div', 'mt-card');
    var em = ce('div', 'mt-card-emoji'); em.textContent = def.emoji;
    var q = ce('div', 'mt-quote'); q.textContent = '«' + esc(phrase) + '»';
    var tn = ce('div', 'mt-tone'); tn.textContent = 'Интонация: ' + esc(def.tone);
    var meta = ce('div', 'mt-conf');
    var bar = ce('div', 'mt-conf-bar'); var barI = ce('i'); barI.style.width = conf + '%'; bar.appendChild(barI);
    var ct = ce('span', 'mt-conf-txt'); ct.textContent = 'Уверенность: ' + conf + '%';
    meta.appendChild(bar); meta.appendChild(ct);
    card.appendChild(em); card.appendChild(q); card.appendChild(tn); card.appendChild(meta);
    if (isDemo) { var d = ce('div', 'mt-demo-tag'); d.textContent = 'демо-режим'; card.appendChild(d); }
    elResult.appendChild(card);
    elResult.hidden = false;
  }

  // ---------- публичный API ----------
  function mount(el) {
    if (!el) return;
    containerEl = el;
    if (!mounted) { build(); mounted = true; }
  }
  function stop() { cleanupAudio(); listening = false; if (elBtn && !micBlocked) { elBtn.disabled = false; elBtn.textContent = '🎙️ Послушать котика'; } if (orbEl) orbEl.classList.remove('is-live', 'is-think'); updateMeter(0); setStatus(''); }

  window.MeowTranslator = { mount: mount, stop: stop };
})();

</script>

<script>
/* ===== js/main.js ===== */
/* js/main.js */
/* js/main.js — связка (владелец: god). Инициализирует CatGame, монтирует
   CatView/Shop/MiniGames, управляет мульти-экранной навигацией, HUD, онбордингом,
   оффлайн-репортом, темами день/ночь, звуком, тостами. По CONTRACT.md §11–12. */
(function () {
  'use strict';

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  var G = window.CatGame;
  var appEl, toastEl, toastTimer = null;

  var STAGE_LABEL = { kitten: '🐣 малыш', teen: '🐾 подросток', adult: '👑 взрослый' };
  var THEME_ORDER = ['auto', 'day', 'night'];
  var THEME_LABEL = { auto: 'авто', day: 'день', night: 'ночь' };

  // ---------- тосты ----------
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // ---------- тема день/ночь ----------
  function applyTheme() {
    if (!appEl) return;
    appEl.setAttribute('data-mg-time', G.isNight() ? 'night' : 'day');
    var tb = $('#btn-theme');
    if (tb) tb.textContent = G.state.settings.theme === 'night' ? '🌙' : (G.state.settings.theme === 'day' ? '☀️' : '🌗');
  }

  // ---------- HUD ----------
  function levelClass(v) { return v <= 25 ? 'bad' : (v <= 50 ? 'warn' : 'ok'); }
  function renderStats() {
    var s = G.state;
    var map = { hunger: s.hunger, hygiene: s.hygiene, happiness: s.happiness, energy: s.energy };
    $all('#stats .stat').forEach(function (el) {
      var k = el.getAttribute('data-stat');
      var v = Math.round(map[k]);
      var fill = $('i', $('.bar', el));
      if (fill) fill.style.width = v + '%';
      el.setAttribute('data-level', levelClass(v) === 'ok' ? 'ok' : levelClass(v));
    });
    // здоровье / болезнь
    var banner = $('#health-banner');
    if (banner) {
      banner.hidden = !s.sick;
      var ns = $('#pet-name-sick'); if (ns) ns.textContent = s.name;
    }
    // энергия для «Играть»
    var playBtn = $('.act[data-act="play"]');
    if (playBtn) playBtn.disabled = s.energy <= 10;
  }
  function renderProgress() {
    var s = G.state;
    var ln = $('#lvl-num'); if (ln) ln.textContent = s.level;
    var need = G.progress.xpForNext();
    var fill = $('#xp-fill'); if (fill) fill.style.width = Math.min(100, Math.round(s.xp / need * 100)) + '%';
    var xt = $('#xp-text'); if (xt) xt.textContent = s.xp + '/' + need;
    var ps = $('#pet-stage'); if (ps) ps.textContent = STAGE_LABEL[s.stage] || s.stage;
    var pn = $('#pet-name'); if (pn) pn.textContent = s.name;
    var pk = $('#pet-streak'); if (pk) pk.textContent = '🔥 ' + G.meta.streak();
  }
  function renderCoins(bumped) {
    var el = $('#coin-balance');
    if (!el) return;
    el.textContent = G.wallet.balance();
    if (bumped) { el.classList.add('bump'); setTimeout(function () { el.classList.remove('bump'); }, 200); }
  }
  function renderProfile() {
    var s = G.state;
    var set = function (id, v) { var e = $(id); if (e) e.textContent = v; };
    set('#pf-name', s.name);
    set('#pf-stage', (STAGE_LABEL[s.stage] || s.stage));
    set('#pf-level', s.level);
    set('#pf-streak', G.meta.streak() + ' 🔥');
    set('#pf-coins', s.counters.coinsEarned);
    var unlocked = G.meta.achievements().filter(function (a) { return a.unlocked; }).length;
    set('#pf-ach', unlocked + ' / ' + G.meta.achievements().length);
    var sb = $('#pf-sound'); if (sb) sb.textContent = (s.settings.sound ? '🔊 Звук: вкл' : '🔇 Звук: выкл');
    var tb = $('#pf-theme'); if (tb) tb.textContent = '🌗 Тема: ' + (THEME_LABEL[s.settings.theme] || 'авто');
  }
  function renderSoundBtn() {
    var b = $('#btn-sound');
    if (b) { b.textContent = G.state.settings.sound ? '🔊' : '🔇'; b.classList.toggle('is-off', !G.state.settings.sound); }
  }

  // ---------- навигация ----------
  var current = 'room';
  function go(screen) {
    if (screen === current) return;
    if (current === 'games' && window.MiniGames && MiniGames.stop) MiniGames.stop();
    if (current === 'translate' && window.MeowTranslator && MeowTranslator.stop) MeowTranslator.stop();
    current = screen;
    $all('.scr').forEach(function (s) { s.classList.toggle('is-active', s.getAttribute('data-screen') === screen); });
    $all('.nav-btn').forEach(function (b) { b.classList.toggle('is-active', b.getAttribute('data-nav') === screen); });
    if (screen === 'profile') renderProfile();
    G.emit('screen:change', { screen: screen });
    sfx('click');
  }

  function sfx(name) { if (window.CatAudio && window.CatAudio.play) window.CatAudio.play(name); }

  // ---------- онбординг / переименование ----------
  var onboardMode = 'new';
  function showOnboard(mode) {
    onboardMode = mode || 'new';
    var ov = $('#onboard'); if (!ov) return;
    var inp = $('#onboard-name');
    var p = ov.querySelector('p');
    var h1 = ov.querySelector('h1');
    var btn = $('#onboard-go');
    if (onboardMode === 'rename') {
      if (h1) h1.textContent = 'Имя котёнка';
      if (p) p.textContent = 'Как теперь зовут питомца?';
      if (btn) btn.textContent = 'Сохранить';
      if (inp) inp.value = G.state.name;
    } else {
      if (h1) h1.textContent = 'Мяугочи';
      if (p) p.textContent = 'У тебя появился котёнок! Как его зовут?';
      if (btn) btn.textContent = 'Завести котёнка 🐾';
      if (inp) inp.value = '';
    }
    ov.hidden = false;
    if (inp) setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
  }
  function submitOnboard() {
    var inp = $('#onboard-name');
    var name = inp ? inp.value.trim() : '';
    if (name) G.setName(name);
    $('#onboard').hidden = true;
    renderProgress(); renderProfile();
    sfx('pop');
  }

  // ---------- оффлайн-репорт ----------
  function humanTime(secs) {
    var h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    if (h > 0) return h + ' ч ' + m + ' мин';
    if (m > 0) return m + ' мин';
    return secs + ' сек';
  }
  function showOffline(secs, coins) {
    var ov = $('#offline'); if (!ov) return;
    var txt = $('#offline-text');
    var msg = 'Тебя не было ' + humanTime(secs) + '. ';
    msg += coins > 0 ? ('Котёнок заработал 🪙 ' + coins + ' микоинов!') : 'Котёнок скучал по тебе 🐾';
    if (txt) txt.textContent = msg;
    ov.hidden = false;
  }

  // ---------- привязка событий ----------
  function bindActions() {
    $all('.act').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-act');
        var ok = G.actions[act] && G.actions[act]();
        if (ok === false) toast('Котёнок слишком устал 😴');
        sfx(act === 'pet' ? 'meow' : (act === 'feed' ? 'eat' : (act === 'wash' ? 'wash' : (act === 'play' ? 'play' : 'sleep'))));
      });
    });
    var heal = $('#btn-heal');
    if (heal) heal.addEventListener('click', function () {
      if (G.actions.heal()) { toast('Котёнок здоров! 💚'); sfx('win'); }
      else toast('Не хватает микоинов на ветеринара 🩺');
    });
    $all('.nav-btn').forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-nav')); }); });

    var bs = $('#btn-sound');
    if (bs) bs.addEventListener('click', function () { G.setSound(!G.state.settings.sound); renderSoundBtn(); renderProfile(); if (G.state.settings.sound) sfx('click'); });
    var bt = $('#btn-theme');
    if (bt) bt.addEventListener('click', function () {
      var i = THEME_ORDER.indexOf(G.state.settings.theme);
      G.setTheme(THEME_ORDER[(i + 1) % THEME_ORDER.length]);
      applyTheme(); renderProfile(); sfx('click');
    });

    // онбординг
    var og = $('#onboard-go'); if (og) og.addEventListener('click', submitOnboard);
    var oi = $('#onboard-name'); if (oi) oi.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitOnboard(); });
    var oo = $('#offline-ok'); if (oo) oo.addEventListener('click', function () { $('#offline').hidden = true; sfx('click'); });

    // профиль
    var pr = $('#pf-rename'); if (pr) pr.addEventListener('click', function () { showOnboard('rename'); });
    var pfs = $('#pf-sound'); if (pfs) pfs.addEventListener('click', function () { G.setSound(!G.state.settings.sound); renderSoundBtn(); renderProfile(); });
    var pft = $('#pf-theme'); if (pft) pft.addEventListener('click', function () { var i = THEME_ORDER.indexOf(G.state.settings.theme); G.setTheme(THEME_ORDER[(i + 1) % THEME_ORDER.length]); applyTheme(); renderProfile(); });
    var pfr = $('#pf-reset'); if (pfr) pfr.addEventListener('click', function () { G.reset(); renderAll(); toast('Прогресс сброшен 🐾'); showOnboard('new'); });

    // разблокировать аудио на первый жест
    var unlock = function () { if (window.CatAudio && CatAudio.resume) CatAudio.resume(); window.removeEventListener('pointerdown', unlock); };
    window.addEventListener('pointerdown', unlock, { once: true });
  }

  function bindGameEvents() {
    G.on('stats:change', renderStats);
    G.on('health:change', function () { renderStats(); });
    G.on('wallet:change', function (d) { renderCoins(d && d.delta > 0); if (d && d.delta > 0) sfx('coin'); if (current === 'profile') renderProfile(); });
    G.on('xp:change', renderProgress);
    G.on('level:up', function (d) { renderProgress(); toast('🎉 Уровень ' + d.level + '!'); sfx('levelup'); });
    G.on('stage:change', function (d) { renderProgress(); toast('✨ Котёнок подрос: ' + (STAGE_LABEL[d.stage] || d.stage)); });
    G.on('name:change', function () { renderProgress(); renderProfile(); });
    G.on('daynight:change', applyTheme);
    G.on('settings:change', function () { renderSoundBtn(); applyTheme(); });
    G.on('achievement:unlock', function (d) { toast('🏆 Достижение получено!'); sfx('win'); if (current === 'profile') renderProfile(); });
    G.on('quest:done', function () { toast('✅ Квест выполнен — забери награду!'); });
    G.on('quest:claim', function (d) { toast('🎁 Награда за квест: +' + (d.reward || 0) + ' 🪙'); });
    G.on('minigame:done', function (d) { toast('Игра окончена! +' + d.reward.coins + ' 🪙, +' + d.reward.xp + ' xp'); });
    G.on('offline:report', function (d) { if (d.secs >= 120) showOffline(d.secs, d.coins); });
  }

  function renderAll() { renderStats(); renderProgress(); renderCoins(false); renderSoundBtn(); applyTheme(); }

  // ---------- старт ----------
  function boot() {
    appEl = $('#app');
    toastEl = $('#toast');
    G = window.CatGame;
    bindActions();
    bindGameEvents();
    G.init().then(function () {
      // первый запуск (нет имени/сейва) → онбординг
      var firstRun = !hadSave();
      if (window.CatView && CatView.mount) CatView.mount($('#stage'));
      if (window.Shop && Shop.mount) Shop.mount($('#screen-shop'));
      if (window.MiniGames && MiniGames.mount) MiniGames.mount($('#screen-games'));
      if (window.MeowTranslator && MeowTranslator.mount) MeowTranslator.mount($('#screen-translate'));
      renderAll();
      if (firstRun) showOnboard('new');
    });
  }
  function hadSave() {
    try { return !!(localStorage.getItem('catgotchi.save.v2') || localStorage.getItem('catgotchi.save.v1')); }
    catch (e) { return true; }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
