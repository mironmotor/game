# GAME MARKET CORE — configuration
# Stage 1 runs fully on synthetic, reproducible data so the pipeline is
# verifiable before any real API keys or live capital are involved.

project:
  name: GAME MARKET CORE
  stage: 1
  # Honest goal framing. The system EVALUATES this target; it does not
  # assume it is reachable. See reports/ for the verdict.
  romi_target_monthly_low: 100      # percent
  romi_target_monthly_high: 300     # percent

data:
  source: synthetic                 # synthetic | csv | exchange
  venue: binance                    # binance | bybit  (for source: exchange)
  symbol: BTCUSDT
  timeframe: 1h
  start_date: 2019-01-01            # exchange fetch start (UTC)
  end_date:                         # blank = now
  bars: 26280                       # synthetic length (~3y hourly)
  seed: 17                          # deterministic synthetic data
  csv_path: data/storage/BTCUSDT_1h.csv
  start_price: 20000.0
  # source: exchange tries live fetch -> CSV cache -> synthetic, in that order,
  # so it always runs even with no network. Cached under data/storage/.

# Cross-asset context (S&P/Nasdaq/gold/dollar via Stooq). Used as REGIME
# context for crypto (risk-on/off, crisis), NOT as separately traded assets.
macro:
  enabled: false                    # set true on a network-enabled machine

# News / world events (GDELT + RSS). Offline -> deterministic synthetic stream
# aligned to the candle range, so the News Shock Engine stays testable.
news:
  enabled: true
  window_hours: 6                   # aggregation window for the news state
  move_threshold: 0.02              # |move| within K bars = "news impact" label
  rss:                              # optional RSS feeds (titles are scored)
    # - https://www.coindesk.com/arc/outboundfeeds/rss/

# On-chain network data (blockchain.info charts). Neutral when offline.
onchain:
  enabled: false                    # set true on a network-enabled machine

# Execution adapter — DRY-RUN by default. Real orders require EVERY gate:
# execution.live + i_understand_risk + non-godmode risk mode + API keys in env
# + a venue implementation (intentionally not shipped). See execution/.
execution:
  live: false
  i_understand_risk: false
  venue: binance
  venue_client_enabled: false       # build the signed order client (needs API keys)
  test_only: true                   # use exchange TEST endpoint (validates, no execution)

# Execution frictions applied by the backtest. Removing these is one of the
# most common ways backtests lie; they are mandatory and non-zero.
costs:
  taker_fee: 0.0004                 # 0.04% per side (typical perp taker)
  slippage_bps: 2.0                 # basis points per fill
  spread_bps: 1.0                   # half-spread cost per fill
  funding_bps_per_8h: 1.0           # rough perpetual funding drag

risk:
  mode: balanced                    # conservative | balanced | aggressive | godmode_research
  start_equity: 10000.0
  max_risk_per_trade: 0.01          # 1% of equity at the stop
  max_daily_loss: 0.06              # 6% — ported from the MT4 EA
  max_weekly_loss: 0.12
  max_drawdown_stop: 0.25           # kill switch: halt at -25% from peak
  max_daily_trades: 3               # ported from the MT4 EA
  max_leverage: 3.0
  loss_streak_cooldown: 3           # bars-off after N consecutive losses
  max_spread_bps: 8.0               # no trade if spread wider than this

strategy:
  false_breakout:
    enabled: true
    sr_lookback: 48                 # bars used to define support/resistance
    atr_period: 14
    atr_penetration: 0.75           # wick must pierce level by >= 0.75 * ATR
    close_back_inside: true         # candle must close back inside the range
    volume_factor: 1.3              # confirming volume vs rolling average
    stop_atr_buffer: 0.5            # stop = wick extreme + buffer * ATR
    reward_risk: 1.8                # take-profit as a multiple of risk
    min_confidence: 0.5
  trend:                            # Stage 2 trend-following engine
    enabled: true
    min_trend_strength: 0.6         # |MACD/ATR| required to call it a trend
    stop_atr: 2.0                   # stop distance in ATRs
    reward_risk: 2.0
    min_confidence: 0.5
  news_shock:                       # Stage 3 news-reaction engine
    enabled: true
    min_severity: 0.6               # event severity required to act
    min_novelty: 0.4
    min_abs_sentiment: 0.35         # too ambiguous -> no trade
    stop_atr: 2.0
    reward_risk: 1.5
    min_confidence: 0.5

# Regime classifier (rule baseline). Gates which engine may trade.
regime:
  trend_strength_threshold: 0.5     # |MACD/ATR| above this => trend/euphoria
  vol_hot_multiple: 1.8             # realized vol vs its running avg => hot

# Walk-forward validation (python3 main.py walkforward)
walk_forward:
  n_folds: 5

backtest:
  one_position_at_a_time: true

scam_detector:
  min_trades: 30
  suspicious_monthly_romi: 50       # percent/month above this = scrutinize
  max_plausible_sharpe: 4.0
  max_plausible_winrate: 0.80

report:
  out_dir: reports/output
