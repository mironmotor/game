name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # GitHub Pages is a static host: no server, so none of the app/api
      # routes (Max17 bridge proxy, Stripe checkout/webhook) can run there
      # regardless of how they build — Vercel is where the live API lives.
      # Next.js's static export (opted into below via GITHUB_PAGES_EXPORT,
      # see next.config.ts) refuses to build any POST-only Route Handler at
      # all, so app/api must be removed before `next build` runs on this
      # target. This step only affects this CI job; Vercel's own build calls
      # `next build` on its own without this flag, so app/api ships there
      # untouched.
      - name: Remove server-only API routes (static export has no server)
        run: rm -rf app/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}
          GITHUB_PAGES_EXPORT: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
